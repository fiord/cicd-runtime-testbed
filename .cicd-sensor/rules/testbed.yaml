# .cicd-sensor/rules/testbed.yaml
#
# 用途:
#   cicd-runtime-testbed 専用の kill / detect / collect 発火ルール
#   (docs/SPEC.md 5節)。実在の IOC は一切使わない。テストベッドの
#   シナリオが書き込む専用マーカーファイルにのみ反応する、自己完結した
#   テスト用ルールセット。
#
# 安全性:
#   このルールセットは cicd-runtime-testbed リポジトリのシナリオが
#   自ら作るマーカーファイルのパスにしか一致しない。実在の悪性
#   ドメイン・IP・攻撃者インフラは参照しない。
#
# CEL の制約 (docs/user-guide/rule-cel-conditions.md を確認して実装。
# フィールド名は docs/user-guide/rule-event-types.md にあるもののみ使用):
#   - 正規表現・添字アクセス・算術は使えない。ここでは `endsWith` と
#     `&&` のみを使用。
#   - `rule_sets:` と `rule_modifiers:` は同一 YAML ドキュメントに
#     同居できないため、このファイルには rule_sets のみを書く。
#
# `description` フィールドについて:
#   docs/user-guide/rule-set.md の "Event rule fields" 表には
#   `description` が載っていないが、これはドキュメント側の記載漏れであり、
#   `description` は正式なフィールドである。根拠:
#     - cicd-sensor 本体のベースラインルールが全て使用している
#       (rules/testevent.yaml, rules/generic-tracking-escape.yaml,
#        rules/generic-execution.yaml ほか)
#     - .claude/rules/30-cel-rules.md が「Write the description as
#       multi-line What: / Why: / Notes: blocks using the YAML `|` block
#       scalar. The agent UI preserves the newlines.」と、description を
#       書くことと、その書式を明示的に要求している
#     - description を含む状態で `cicd-sensorctl rule validate` が
#       `OK: 1 file(s) bundled and validated` を返すことを実機で確認済み
#   description はエージェント UI とレポートに表示されるため、
#   コメントではなくフィールドとして書く。
#
# 期待される検知内容:
#   - testbed_kill_marker: scenarios/90-killme.sh が書く
#     cicd-sensor-killme.marker への書き込みで発火し、action: terminate。
#     sensor-enforce.yml (monitor_mode: false) ではプロセスが実際に
#     kill される想定。sensor-monitor.yml (monitor_mode: true) では
#     terminate は detect として扱われる。
#   - testbed_detect_marker / testbed_collect_marker: detect / collect
#     アクションを個別に確認するための自己完結ルール。
#     scenarios/07-rule-markers.sh (sensor-monitor.yml から実行) が
#     cicd-sensor-detect.marker / cicd-sensor-collect.marker への
#     書き込みを行ない、この2つのルールを発火させる
#     (レビューで見つかった仕様の穴: 当初はこれらのマーカーファイルを
#     書き込むシナリオが存在せず、死んだルールになっていた)。
#
# 実地実行 (run 32510077347) で判明した最重要の事実と、それへの対応
# (2つ目の ruleset, cicd_runtime_testbed/canary_observability):
#   cicd-sensor は「ルールに一致したイベント」の詳細 (process.argv /
#   process.ancestors / payload の全フィールド) しか記録しない。
#   ルールが1つも発火しないイベントは standalone モードのレポートに
#   一切現れない (生のイベントストリームは存在しない)。
#   このため、02-exfil.sh が argv に載せる CANARY_ARGV_SHORT /
#   CANARY_ARGV_LONG や、00-seed.sh が作る CANARY_PATH 配下のマーカー、
#   02-exfil.sh の平文 HTTP の path/query は、そのプロセス / イベントが
#   何らかのルールに一致しない限り「漏れたかどうか」を観測すること自体が
#   できない (漏れなかったのではなく、見る場所が無い)。
#
#   以下の3ルールは、この観測用ギャップを埋めるためだけに存在する
#   自己完結ルールで、すべて action: collect (ジョブを止めず、
#   Detection Log に載せるだけ)。実在の IOC には一切依存しない。
#   - testbed_canary_argv_carrier: curl の実行そのものを collect する。
#     02-exfil.sh が実行する curl 呼び出し全般 (CANARY_ARGV_SHORT /
#     CANARY_ARGV_LONG / CANARY_ARGV_FLAG を argv に含むものを含む) を
#     ヒットさせ、そのヒットの process.argv を通じてカナリアが
#     実際に記録されるかどうかを観測できるようにする。
#   - testbed_canary_path_probe: 00-seed.sh が /tmp/${CANARY_PATH}/ 配下に
#     作る専用マーカー (canary-path-probe.marker) への書き込みを collect
#     する。ヒットの payload.path に /tmp/<CANARY_PATH の値>/... が
#     そのまま現れるため、CANARY_PATH (ディレクトリ名) が観測できるように
#     なる。
#   - testbed_canary_http_host: host が example.com の http_request を
#     collect する。ヒットの payload.path / payload.method を通じて
#     CANARY_URL_PATH / CANARY_URL_QUERY (query は payload.path には
#     含まれない仕様のため、query 側は「除去された」ことの確認になる)
#     が観測できるようになる想定だった。
#
#     ##################################################################
#     # 現在コメントアウトして無効化中 (run 32544606013、2026-08-22)。 #
#     # 詳細は下の rule 定義箇所のコメントブロックを参照。             #
#     ##################################################################
#
#   `domain` イベント (CANARY_DNS) は既に attestation predicate の
#   `domains` 配列に現れる (集計レベルでも観測できる) ため、専用の
#   観測用ルールは追加しない。

rule_sets:
  - ruleset_id: cicd_runtime_testbed/kill_test

    rules:
      - rule_id: testbed_kill_marker
        rule_name: "Testbed: kill marker written"
        description: |
          What:
            Detects a write to cicd-sensor-killme.marker, a marker file
            created only by scenarios/90-killme.sh in this testbed.
          Why:
            Verifies that cicd-sensor actually terminates a job process
            when monitor_mode is disabled. This is a self-contained
            trigger that does not rely on any real IOC.
          Notes:
            This is a testbed rule, not a security detection. Under
            sensor-enforce.yml (monitor_mode: false) a match is expected
            to terminate the job. Under sensor-monitor.yml
            (monitor_mode: true) terminate is downgraded to detect, so
            the rule matches but nothing is killed.
        event_type: file_open
        condition: is_write && path.endsWith("/cicd-sensor-killme.marker")
        action: terminate

      - rule_id: testbed_detect_marker
        rule_name: "Testbed: detect marker written"
        description: |
          What:
            Detects a write to cicd-sensor-detect.marker, a marker file
            created only by scenarios/07-rule-markers.sh in this testbed.
          Why:
            Exercises the detect action path independently of terminate
            and collect, so all three actions can be observed in one run.
          Notes:
            This is a testbed rule, not a security detection. Written by
            scenarios/07-rule-markers.sh, which sensor-monitor.yml runs.
        event_type: file_open
        condition: is_write && path.endsWith("/cicd-sensor-detect.marker")
        action: detect

      - rule_id: testbed_collect_marker
        rule_name: "Testbed: collect marker written"
        description: |
          What:
            Detects a write to cicd-sensor-collect.marker, a marker file
            created only by scenarios/07-rule-markers.sh in this testbed.
          Why:
            Exercises the collect action path independently of terminate
            and detect. collect hits are emitted to the Detection Log but
            are excluded from the attestation predicate, so this rule also
            lets us confirm that documented exclusion in practice.
          Notes:
            This is a testbed rule, not a security detection. Written by
            scenarios/07-rule-markers.sh, which sensor-monitor.yml runs.
        event_type: file_open
        condition: is_write && path.endsWith("/cicd-sensor-collect.marker")
        action: collect

  - ruleset_id: cicd_runtime_testbed/canary_observability
    rules:
      - rule_id: testbed_canary_argv_carrier
        rule_name: "Testbed: curl execution (argv canary carrier)"
        description: |
          What:
            Matches every curl execution. In this testbed, curl is the
            process that carries CANARY_ARGV_SHORT / CANARY_ARGV_LONG
            (scenarios/02-exfil.sh, --referer / -A options) and
            CANARY_ARGV_FLAG (Authorization header) in its argv.
          Why:
            cicd-sensor only records the full detail (process.argv,
            process.ancestors, payload) of events that match some rule;
            events with no match do not appear in the standalone report
            at all. Without this rule, the curl processes carrying the
            argv canaries never produce a hit, so there is no way to
            observe whether the argv canaries survive into the report
            (this was the root cause behind "the argv canary is never
            found" in run 32510077347). This rule exists purely to make
            those curl invocations observable; it does not depend on any
            real IOC.
          Notes:
            This intentionally matches curl broadly (including the DNS /
            HTTPS control-group steps of 02-exfil.sh), which is fine:
            action is collect, so it only adds Detection Log entries and
            never stops the job.
        event_type: process_exec
        condition: process.exec_path.endsWith("/curl")
        action: collect

      - rule_id: testbed_canary_path_probe
        rule_name: "Testbed: canary-path observation probe written"
        description: |
          What:
            Detects a write to canary-path-probe.marker, a dedicated
            marker file created only by scenarios/00-seed.sh under
            /tmp/${CANARY_PATH}/ (i.e. its directory name is the
            CANARY_PATH value itself).
          Why:
            Same root cause as testbed_canary_argv_carrier: without a
            rule matching this write, the CANARY_PATH directory is never
            part of any recorded event, so payload.path (which would
            contain the CANARY_PATH value as part of the path) never
            appears in the report. This rule is a self-contained
            observation probe, independent of the pre-existing
            /tmp/${CANARY_PATH}/marker file used by other scenarios.
          Notes:
            This is a testbed rule, not a security detection. Written by
            scenarios/00-seed.sh, which runs in every detection workflow
            (sensor-monitor.yml, and any workflow that calls 00-seed.sh).
        event_type: file_open
        condition: is_write && path.endsWith("/canary-path-probe.marker")
        action: collect

      # ----------------------------------------------------------------
      # testbed_canary_http_host — DISABLED (commented out), not deleted.
      #
      # なぜコメントアウトしているか:
      #   このルールの event_type: http_request は、実際にこのテストベッド
      #   が使う cicd-sensor のリリース (README.md "既知の制約" 参照:
      #   cicd-sensor-action の入力 cicd-sensor-version の既定値は
      #   v0.0.45、2026-08-09 時点のタグ) にまだ実装されていない。
      #   http_request 対応 (commit bdec37f2, 2026-08-11) は現時点で
      #   cicd-sensor の main ブランチにしか存在せず、v0.0.45 を含む
      #   どのリリース済みタグにも含まれていない。
      #
      # 実測で判明した最重要の事実 (run 32544606013,
      # https://github.com/fiord/cicd-runtime-testbed/actions/runs/32544606013,
      # sensor-enforce.yml, 2026-08-22):
      #   このルールが有効なままだと、単に「このルールだけが静かに
      #   drop される」のではなく、**プロジェクト設定バンドル全体
      #   (.cicd-sensor/ 配下の monitor_mode と全カスタムルール) の
      #   検証が失敗し、agent 側がフォールバックする** ことが実機で
      #   確認された。実際のジョブログ (Start cicd-sensor ステップ):
      #
      #     ==> Loaded .cicd-sensor/config.yaml from repo
      #     OK: 1 file(s) bundled into
      #       /home/runner/work/_temp/cicd-sensor-config/rules.bundle.yaml
      #     error: bundle: ruleset_id=cicd_runtime_testbed/canary_observability
      #       rule_id=testbed_canary_http_host: unsupported event type
      #       "http_request"
      #     rule validate: bundle failed validation
      #     ##[warning]project config fetch failed:
      #       /home/runner/work/_temp/cicd-sensor-staging/extracted/
      #       cicd-sensorctl-linux-amd64 exited with status 1; agent will
      #       run with baseline rules
      #     ==> Registering project start
      #
      #   この run は sensor-enforce.yml (monitor_mode: false のはず)
      #   だったが、上記の理由で .cicd-sensor/config.yaml の
      #   monitor_mode: false が agent に届かず、testbed_kill_marker
      #   (action: terminate のはず) が attestation predicate / HTML
      #   レポートの両方で action: detect として記録され、
      #   REACHED_AFTER_KILLME がログに出力された (= プロセスは
      #   kill されなかった)。つまり **不対応のイベント型を使う
      #   ルールが1本あるだけで、プロジェクト設定全体
      #   (monitor_mode を含む) が無効化され、他の正常なカスタム
      #   ルールの意味まで変わってしまう。** README.md "既知の制約"
      #   に以前書かれていた「rules_summary.warnings_count が増える
      #   だけでハードエラーにはならない」という説明は、
      #   (sensor-monitor.yml 相当の) 別の実行経路での観測であり、
      #   sensor-enforce.yml のこの実行では成り立たなかった。
      #
      # 有効化してよい条件:
      #   このテストベッドがピン留めする cicd-sensor-action /
      #   cicd-sensor-version が、http_request イベント型に対応した
      #   リリースを指すようになったとき。その時点でこのコメントを
      #   外すだけで、変更なしに発火するようになる想定
      #   (canary_observability ruleset の他の2ルールと同じ形)。
      #   有効化した後は、まず GitHub Actions 上で実際に走らせて
      #   job summary の rules_summary / ::warning:: 注釈と、
      #   sensor-enforce.yml の assert ジョブが追加出力する
      #   testbed_kill_marker の実際の action を確認すること
      #   (`cicd-sensorctl rule validate` はローカルでは通ってしまい、
      #   この不整合を検出できない)。
      #
      # ruleset 自体 (cicd_runtime_testbed/canary_observability) は
      # 残す: 兄弟ルール testbed_canary_argv_carrier /
      # testbed_canary_path_probe は http_request に依存せず、
      # 引き続き有効。
      # ----------------------------------------------------------------
      # - rule_id: testbed_canary_http_host
      #   rule_name: "Testbed: plaintext HTTP request to example.com"
      #   description: |
      #     What:
      #       Matches outgoing plaintext HTTP requests whose Host is
      #       example.com, the only HTTP endpoint this testbed is allowed
      #       to contact (docs/SPEC.md 1節).
      #     Why:
      #       scenarios/02-exfil.sh sends CANARY_URL_PATH in the request
      #       path and CANARY_URL_QUERY in the query string. Per the same
      #       root cause as the other two rules in this ruleset, without a
      #       matching rule the http_request event carrying
      #       payload.path / payload.method is never recorded, so neither
      #       the "path survives" nor the "query string is stripped"
      #       hypothesis (docs/SPEC.md 3節) can actually be observed from
      #       the report.
      #     Notes:
      #       This is a testbed rule, not a security detection.
      #       example.com is an IANA reserved domain; matching on it here
      #       does not reference any real IOC.
      #   event_type: http_request
      #   condition: host == "example.com"
      #   action: collect
