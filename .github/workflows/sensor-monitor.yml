# .github/workflows/sensor-monitor.yml
#
# 検証目的 (docs/SPEC.md T1 / T2 / §8):
#   cicd-sensor を GitHub-hosted standalone モード (Manager なし) で動かし、
#   検知シナリオ (scenarios/00〜07) を実行した際に、何が検知され、どんな
#   成果物 (HTML レポート / attestation predicate) が得られるかを確認する。
#
# 重要 (仕様の根本的な誤りの修正、docs/SPEC.md §5。旧版のこのコメントは
# 誤りだったので書き換えた):
#   cicd-sensor-action は、プロジェクト設定 (.cicd-sensor/config.yaml) と
#   カスタムルール (.cicd-sensor/rules/) を、ジョブのワークスペース上の
#   ファイルからではなく GitHub Contents API 経由でコミット SHA
#   (GITHUB_SHA) から取得する (cicd-sensor-action v0.0.38,
#   src/main.js:643-666)。そのため .cicd-sensor/config.yaml の
#   monitor_mode は、このリポジトリにコミットされている値
#   (現在 `false`) で常に決まり、ワークフロー実行時に書き換えることは
#   できない (旧版はこのファイルを実行時に書き換える no-op ステップを
#   持っていたが削除した。理由は下記参照)。
#
#   これにより、このワークフローも monitor_mode: false (terminate 有効)
#   で動く。.cicd-sensor/rules/testbed.yaml の testbed_kill_marker
#   (action: terminate) は cicd-sensor-killme.marker への書き込みでのみ
#   発火するが、そのマーカーを書く scenarios/90-killme.sh はこの
#   ワークフローからは実行しない (sensor-enforce.yml 専用) ため発火しない。
#   ベースラインルールで action: terminate を持つものの列挙と、この
#   ワークフローが実行する scenarios/00〜07 がそれらに触れないことの
#   根拠は .cicd-sensor/config.yaml のコメントと README.md「既知の制約」
#   を参照。万一将来シナリオが変更されてベースラインの terminate 条件に
#   触れた場合、このワークフローのジョブも実際に kill されるリスクが
#   残ることをここに明記しておく。
#
#   scenarios/07-rule-markers.sh は、レビューで見つかった仕様の穴
#   (testbed_detect_marker / testbed_collect_marker ルールを発火させる
#   シナリオが存在せず、死んだルールになっていた) を塞ぐために追加した。
#   これにより detect / collect (このワークフロー) と terminate
#   (sensor-enforce.yml の 90-killme.sh) の3アクションすべてが
#   実地検証できる。

name: "sensor-monitor: cicd-sensor detection scenarios (monitor_mode: false, committed)"

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  monitor:
    name: "monitor (no kill)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout cicd-runtime-testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 削除済み: 以前ここに「Set monitor_mode true in
      # .cicd-sensor/config.yaml」という、チェックアウト後のワークスペース
      # 上の .cicd-sensor/config.yaml を書き換えるステップがあった。
      # cicd-sensor-action はプロジェクト設定を GitHub Contents API
      # 経由でコミット SHA から取得する (src/main.js:643-666) ため、
      # ワークスペース上のこのファイルへの変更を action は一切見ない。
      # つまりこのステップは常に no-op であり、実際に使われる値は
      # リポジトリにコミットされている .cicd-sensor/config.yaml の内容
      # (現在 monitor_mode: false) だった。読む人を誤解させるだけなので
      # 削除した。詳細は .cicd-sensor/config.yaml のコメントと
      # docs/SPEC.md §5、README.md「既知の制約」を参照。

      - name: Install cicd-sensorctl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # NOTE (未検証・要確認): cicd-sensor/docs/user-guide/self-hosted-install.md
          # に記載の命名規則 (cicd-sensor_<version>_linux_<arch>.tar.gz、中に
          # cicd-sensorctl-linux-<arch>) に基づく。バージョンは
          # cicd-sensor-action の pin (v0.0.38, README 参照) に合わせた。
          # cicd-sensor/cicd-sensor のリリース一覧を実際に確認できていないため、
          # 実行前にこのステップが動くことを確認すること (README 参照)。
          mkdir -p "${RUNNER_TEMP}/cicd-sensorctl"
          if gh release download v0.0.38 \
              --repo cicd-sensor/cicd-sensor \
              --pattern "cicd-sensor_*_linux_amd64.tar.gz" \
              --dir "${RUNNER_TEMP}/cicd-sensorctl"; then
            tar -xzf "${RUNNER_TEMP}"/cicd-sensorctl/cicd-sensor_*_linux_amd64.tar.gz -C "${RUNNER_TEMP}/cicd-sensorctl"
            sudo install -m 0755 "${RUNNER_TEMP}/cicd-sensorctl/cicd-sensorctl-linux-amd64" /usr/local/bin/cicd-sensorctl
            cicd-sensorctl version || true
          else
            echo "::warning::failed to download cicd-sensorctl (see README: install method is unverified). Skipping rule validation."
          fi

      - name: Validate .cicd-sensor/rules
        # 実地実行 (run 32544606013, sensor-enforce.yml) で判明した事実への
        # 対応: 以前はこのステップが失敗しても ::warning:: を出すだけで
        # 後続 (cicd-sensor-action) に進んでいた。しかし
        # testbed_canary_http_host (event_type: http_request, 当時ピン留め
        # していたバージョン未対応) が1本混入していただけで、
        # cicd-sensor-action 内部の project config fetch がバンドル
        # 検証エラーで失敗し、.cicd-sensor/config.yaml の monitor_mode を
        # 含むプロジェクト設定全体が agent に届かずベースラインへ
        # フォールバックする、という重大な不具合を静かに見逃していた。
        # そのため、ここで実際に検証が失敗した場合はこのステップ自体で
        # ジョブを失敗させ、以降のワークフロー実行者が気づけるようにする。
        # cicd-sensorctl そのものが入手できなかった場合 (README「セットアップ」
        # 3節、入手経路が未検証のため) は、従来どおり警告のみで続行して
        # よいが、「検証をスキップした」ことを job summary に残す。
        run: |
          set -uo pipefail
          if command -v cicd-sensorctl >/dev/null 2>&1; then
            if cicd-sensorctl rule validate .cicd-sensor/rules; then
              {
                echo "## Validate .cicd-sensor/rules: OK"
                echo ""
                echo "\`cicd-sensorctl rule validate .cicd-sensor/rules\` passed."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              {
                echo "## Validate .cicd-sensor/rules: FAILED"
                echo ""
                echo "\`cicd-sensorctl rule validate .cicd-sensor/rules\` exited with status ${status}."
                echo ""
                echo "未対応のイベント型を使っていないか確認すること。**1本でも無効な"
                echo "ルールがあると、プロジェクト設定全体 (\`monitor_mode\` を含む) が"
                echo "agent に届かなくなる** (run 32544606013 で実機確認済み。"
                echo "README.md \"既知の制約\" 参照)。"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::cicd-sensorctl rule validate failed (exit ${status}). Check whether a rule uses an event type unsupported by the pinned cicd-sensor release (e.g. http_request). Even a single invalid rule discards the ENTIRE project config bundle at agent startup — not just that one rule — so monitor_mode and every other custom rule silently fail to reach the agent too. See README.md known limitations (run 32544606013)."
              exit "${status}"
            fi
          else
            {
              echo "## Validate .cicd-sensor/rules: SKIPPED"
              echo ""
              echo "\`cicd-sensorctl\` was not available (see the previous step), so"
              echo "\`cicd-sensorctl rule validate .cicd-sensor/rules\` was **not run** for"
              echo "this job. A rule using an unsupported event type would therefore"
              echo "NOT be caught here — it would only surface later, as a project-config"
              echo "fetch failure inside the \"Start cicd-sensor\" step below, which"
              echo "silently discards \`monitor_mode\` and all custom rules if it happens"
              echo "(see README.md known limitations, run 32544606013)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::cicd-sensorctl not available; rule validation skipped (see job summary — this means an invalid rule would not be caught locally)"
          fi

      - name: Start cicd-sensor (standalone mode)
        uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - name: Run detection scenarios
        shell: bash
        env:
          CANARY_ENV: ${{ secrets.CANARY_ENV }}
        run: |
          set -uo pipefail
          echo "::group::00-seed"
          bash scenarios/00-seed.sh
          echo "::endgroup::"

          echo "::group::01-credential-access"
          bash scenarios/01-credential-access.sh
          echo "::endgroup::"

          echo "::group::02-exfil"
          bash scenarios/02-exfil.sh
          echo "::endgroup::"

          echo "::group::03-npm-postinstall"
          npm install --no-audit --no-fund ./scenarios/03-npm-postinstall || true
          echo "::endgroup::"

          echo "::group::04-persistence"
          bash scenarios/04-persistence.sh
          echo "::endgroup::"

          echo "::group::05-memfd-exec"
          bash scenarios/05-memfd-exec.sh
          echo "::endgroup::"

          echo "::group::06-anti-forensics"
          bash scenarios/06-anti-forensics.sh
          echo "::endgroup::"

          echo "::group::07-rule-markers"
          bash scenarios/07-rule-markers.sh
          echo "::endgroup::"

  collect-telemetry:
    name: "collect telemetry (T2)"
    needs: monitor
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # cicd-sensor-report.html / cicd-sensor-attestation (monitor ジョブが
      # アップロードした, retention 未指定のアーティファクト) を回収し、
      # retention-days: 1 の telemetry-cicd-sensor-monitor に詰め直したうえで
      # 元のアーティファクトを削除するため write が必要。
      actions: write
    steps:
      # cicd-sensor-action uploads the HTML report artifact as
      # `cicd-sensor-report.html` (confirmed via `gh api
      # repos/<owner>/<repo>/actions/runs/<run_id>/artifacts` against a real
      # run). An earlier revision of this workflow used `cicd-sensor-report`
      # (no extension) here, which never matched and made this download
      # silently fail via `continue-on-error: true` on every run. The local
      # `path:` below (telemetry/cicd-sensor-report) is our own extraction
      # folder name, independent of the artifact name, and intentionally
      # left as-is: tools/render-matrix.py's evidence-granularity detection
      # matches on this basename.
      - name: Download cicd-sensor-report.html
        id: download_report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: cicd-sensor-report.html
          path: telemetry/cicd-sensor-report

      - name: Download cicd-sensor-attestation
        id: download_attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: cicd-sensor-attestation
          path: telemetry/cicd-sensor-attestation

      # 実地実行 (run 32381640678) で判明した不具合への対応:
      # 上記2つの download-artifact に continue-on-error: true を付けている
      # ため、cicd-sensor-report.html (HTML レポート) の取得に失敗しても黙って
      # 進んでしまい、telemetry-cicd-sensor-monitor の中身が
      # cicd-sensor-attestation/predicate.json の1ファイルだけという
      # 「収集不完全なのに成功扱い」の成果物が上がっていた。
      # ここで各アーティファクトの取得成否を明示し、
      # - 1つも取得できなかった場合はこのジョブ自体を失敗させる
      # - 一部だけ取得できた場合は ::warning:: を出して続行する
      # - どちらの場合も job summary と telemetry-manifest.txt に記録する
      # (docs/SPEC.md §6)。continue-on-error 下でも steps.<id>.outcome は
      # 実際の成否を反映する (conclusion とは異なり continue-on-error の
      # 影響を受けない) ため、これを判定に使う。
      - name: Summarize telemetry collection
        id: telemetry_summary
        if: always()
        run: |
          set -uo pipefail
          mkdir -p telemetry

          report_outcome="${{ steps.download_report.outcome }}"
          attestation_outcome="${{ steps.download_attestation.outcome }}"

          total=2
          found=0
          missing_names=""

          {
            echo "# telemetry-manifest.txt"
            echo "# collect-telemetry job of sensor-monitor.yml (run ${{ github.run_id }})"
            echo "# format: <artifact-name>: OK | MISSING (download outcome=<outcome>)"
          } > telemetry/telemetry-manifest.txt

          if [ "${report_outcome}" = "success" ]; then
            found=$((found + 1))
            echo "cicd-sensor-report.html: OK" >> telemetry/telemetry-manifest.txt
          else
            missing_names="${missing_names}cicd-sensor-report.html "
            echo "cicd-sensor-report.html: MISSING (download outcome=${report_outcome})" >> telemetry/telemetry-manifest.txt
          fi

          if [ "${attestation_outcome}" = "success" ]; then
            found=$((found + 1))
            echo "cicd-sensor-attestation: OK" >> telemetry/telemetry-manifest.txt
          else
            missing_names="${missing_names}cicd-sensor-attestation "
            echo "cicd-sensor-attestation: MISSING (download outcome=${attestation_outcome})" >> telemetry/telemetry-manifest.txt
          fi

          {
            echo "## Telemetry collection summary (T2)"
            echo ""
            echo "| artifact | status |"
            echo "| --- | --- |"
            if [ "${report_outcome}" = "success" ]; then
              echo "| \`cicd-sensor-report.html\` | ✅ collected |"
            else
              echo "| \`cicd-sensor-report.html\` | ❌ missing (download outcome=\`${report_outcome}\`) |"
            fi
            if [ "${attestation_outcome}" = "success" ]; then
              echo "| \`cicd-sensor-attestation\` | ✅ collected |"
            else
              echo "| \`cicd-sensor-attestation\` | ❌ missing (download outcome=\`${attestation_outcome}\`) |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${found}" -eq 0 ]; then
            echo "::error::telemetry collection failed: none of the expected artifacts (cicd-sensor-report.html, cicd-sensor-attestation) could be downloaded for this run. See telemetry-manifest.txt / job summary."
            echo "❌ **0 / ${total} expected artifacts collected. Failing this job (docs/SPEC.md §6).**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "${found}" -lt "${total}" ]; then
            echo "::warning::telemetry collection partial: missing ${missing_names}(collected ${found}/${total}). See telemetry-manifest.txt in the uploaded telemetry-cicd-sensor-monitor artifact."
            echo "⚠️ **${found} / ${total} expected artifacts collected. Missing: ${missing_names}(see telemetry-manifest.txt).**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **${found} / ${total} expected artifacts collected.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload telemetry-cicd-sensor-monitor
        # 上の Summarize ステップが「1つも取得できなかった」場合に exit 1
        # するため、if: always() を付けて、その場合でも
        # telemetry-manifest.txt (何が欠けていたかの記録) を含む
        # 部分的なテレメトリを必ずアップロードする。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-cicd-sensor-monitor
          path: telemetry/
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce artifact retention (delete original cicd-sensor-report.html / cicd-sensor-attestation)
        # cicd-sensor-action uploads these itself with no retention-days
        # override we control (docs/SPEC.md §1-5 requires retention-days: 1
        # everywhere). We keep our own copy above and delete the originals.
        # if: always() so cleanup still runs even if "Summarize telemetry
        # collection" above failed the job (0 artifacts collected case).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for name in cicd-sensor-report.html cicd-sensor-attestation; do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=${name}" \
              --jq '.artifacts[0].id // empty' || true)
            if [ -n "${id}" ]; then
              echo "Deleting artifact '${name}' (id=${id})"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || \
                echo "::warning::failed to delete artifact '${name}' (id=${id}); delete it manually"
            else
              echo "Artifact '${name}' not found; nothing to delete"
            fi
          done
