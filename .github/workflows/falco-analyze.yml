# .github/workflows/falco-analyze.yml
#
# 検証目的 (docs/SPEC.md T1 / T2 / §8):
#   falco-actions の analyze モードで、検知シナリオ実行中の syscall を
#   sysdig capture (capture.scap) に記録し、falco の replay エンジンで
#   後から解析した際に何が検知・抽出されるかを確認する。
#
#   analyze action の `custom-rule-file` は明示的に渡さない限り
#   falco-actions 同梱の CI/CD ルールセットを一切ロードしない
#   (start action の live モードだけが `cicd-rules: true` で自動ロードする
#   ため、analyze action には対応する自動ロード機構が存在しない)。
#   このワークフローは falcosecurity/falco-actions リポジトリ本体
#   (rules/falco_cicd_rules.yaml) を pin 済み ref でチェックアウトし、
#   その場所を custom-rule-file に明示的に渡す。live モードと同じ
#   ルールセットで比較できるようにするため。
#
#   なぜ falco-version が 0.39.2 か: analyze action は使用イメージを
#   `IMAGE="falcosecurity/falco-no-driver"` にハードコードしている
#   (falco-actions/analyze/action.yaml)。このイメージは Docker Hub 上の
#   数値バージョンタグの最大が `0.39.2` で止まっている (latest の最終 push も
#   2024-11-21 で、事実上メンテナンスが止まっている)。falco 本体イメージ
#   (falcosecurity/falco) は 0.44.1 まであるが、falco-actions はそちらを
#   使わないためこのテストベッドから利用する手段が無い。以前は
#   `falco-version: "0.43.0"` を指定していたが、これは
#   `required_engine_version: 0.43.0` (falco_cicd_rules.yaml のルールエンジン
#   バージョン宣言、Falco のリリースバージョンとは別系統) を Falco の
#   リリース番号と取り違えた仕様策定時の誤りであり、実在しないタグを指定して
#   `manifest unknown` (exit 125) で失敗していた。
#
#   さらに重要な点: `0.39.2` に直しても、`custom-rule-file` で渡す
#   falco_cicd_rules.yaml 自体が `required_engine_version: 0.43.0` を宣言して
#   いるため、falco エンジン 0.39.2 がこのルールファイルをロード時に拒否する
#   (または警告のみで通す) 可能性がある。つまり「falco-actions は、自身の
#   同梱 CI/CD ルールが要求するエンジンバージョンを満たすイメージを pull
#   できない可能性が高い」という仮説が成り立つ。"Analyze capture" ステップに
#   `continue-on-error: true` を付けて実際の成否を観測し、job summary と
#   docs/RESULTS-TEMPLATE.md に記録する (下記ステップ参照)。
#
# 安全性 (docs/SPEC.md §1-6):
#   falco-actions の stop action (analyze モード) は capture.scap を
#   無条件に "capture" という名前のアーティファクトとしてアップロードする
#   (falco-actions のコードにハードコードされており、抑止する入力は無い。
#   元リポジトリは変更しないため、この動作自体は変えられない)。
#   このワークフローは、それを埋め合わせるため:
#     1. workflow_dispatch 入力 `upload_raw_capture` が true のときだけ、
#        capture.scap を自分たち自身のアーティファクト
#        (telemetry-falco-analyze) に含める。この場合に限り
#        telemetry-falco-analyze の retention-days は 1 に短縮される
#        (false のときは 7 日。docs/REQUIRED-FIXES.md R-6)。
#     2. capture.scap を含む "capture" アーティファクト (falco-actions が
#        アップロードしたもの) と "hashes" アーティファクトは、telemetry
#        アーティファクトの作成後に GitHub API で必ず削除する。
#   この「アップロード後にすぐ削除する」方式には、削除が完了するまでの
#   数秒〜数十秒程度、GitHub 上でアーティファクトが一覧に載る短い時間差が
#   存在する。元アクションを改変できない制約下での緩和策であり、完全な
#   「既定でアップロードしない」と同一ではないことを README / SAFETY.md に
#   明記している。
#
# ============================================================================
# public リポジトリでの実行について
# ============================================================================
#   結論: public リポジトリで実行してよい。upload_raw_capture の値に
#   かかわらずジョブを停止するガードは存在しない (以前のバージョンには
#   あったが、過剰と判断して撤去した)。
#
#   根拠 (このリポジトリの現状に依存する。下の「再評価が必要な条件」も
#   参照すること):
#     1. capture.scap に入りうるカナリア値はすべて偽物で、リポジトリに
#        コミット済み。公開されても失うものがない (docs/SAFETY.md 1節)。
#     2. このワークフローが実際に持つ本物の認証情報は次の2つだけ:
#        - GITHUB_TOKEN: 宣言している権限は `contents: read` のみ。
#          public リポジトリではこれは「誰でも読み取れる情報」に対する
#          権限に過ぎず、しかもジョブ完了時に失効する。
#        - ACTIONS_RUNTIME_TOKEN: run 中のみ有効な内部トークン。悪用の
#          本命経路は actions/cache への汚染だが、このリポジトリは
#          actions/cache を使っていないため、その経路自体が存在しない。
#     3. `id-token: write` を宣言していないため、
#        ACTIONS_ID_TOKEN_REQUEST_TOKEN は存在しない。
#     4. 残るリスクは「このテストリポジトリ自身のアーティファクトを
#        他人が上書きできるかもしれない」程度であり、T3 (capture.scap
#        から実際に何が漏れるかを自分の目で確かめる) の検証価値の
#        ほうが上回る。
#
#   このワークフローは T3 (secret が漏れないか) の検証で「実際に
#   capture.scap から漏れること」を観測するために存在する。つまり
#   漏洩を再現するのが目的であり、漏洩して当然の作りである。上記の
#   根拠により、その観測を public リポジトリで行なってよい。
#
#   再評価が必要な条件 (次のいずれかが起きたら、この判断を見直すこと):
#     - リポジトリに本物の secret を追加した場合
#     - `contents: write` や `id-token: write` を宣言した場合
#     - `actions/cache` を使い始めた場合
#
#   下の "Notice: raw capture exposure on a public repository" ステップは
#   ジョブを停止せず、public リポジトリで実行されたときに capture.scap へ
#   具体的に何が入りうるかを警告注釈と job summary に書くだけの情報提供
#   ステップである。
# ============================================================================

name: "falco-analyze: detection scenarios (analyze mode, capture.scap)"

on:
  workflow_dispatch:
    inputs:
      upload_raw_capture:
        description: >-
          true にすると capture.scap (生の syscall キャプチャ) を
          telemetry-falco-analyze アーティファクトに含める。
          T3 の「capture.scap から実際に漏れること」を観測するには true が必要。
          public repo では retention-days: 1 の間 (true のときだけ 1 日に
          短縮される。false のときは 7 日。docs/REQUIRED-FIXES.md R-6)、
          誰でもダウンロードできる
          状態になる (このリポジトリのカナリアはすべて偽物で、実在する
          トークンは失効済み GITHUB_TOKEN と run 中限定の
          ACTIONS_RUNTIME_TOKEN のみ。詳細はこのファイル冒頭のコメントを
          参照)。既定は false。public repo でも true にできるが、
          常時 true にする運用は避けること。
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  record:
    name: "record (sysdig capture)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # public リポジトリで capture.scap に何が入りうるかを知らせるだけの
      # 情報提供ステップ。ジョブは停止しない (冒頭のコメントブロックを参照)。
      - name: "Notice: raw capture exposure on a public repository"
        shell: bash
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          UPLOAD_RAW: ${{ inputs.upload_raw_capture }}
        run: |
          set -uo pipefail

          if [ "$IS_PRIVATE" = "true" ]; then
            echo "private リポジトリで実行中。"
            exit 0
          fi

          echo "::warning title=public リポジトリで analyze モードを実行中::falco-actions の stop action は capture.scap を無条件にアップロードする (削除するまでの数秒〜数十秒は誰でもダウンロード可能)。upload_raw_capture=${UPLOAD_RAW} の場合、telemetry-falco-analyze にも retention-days: 1 の間含まれる。詳細は job summary を参照。"

          {
            echo "## ℹ️ public リポジトリで analyze モードを実行しています"
            echo
            echo "\`upload_raw_capture: ${UPLOAD_RAW}\` で実行されました。ジョブは停止しません"
            echo "(このワークフローの目的は、public リポジトリで capture.scap に何が入るかを"
            echo "実際に観測することそのものです)。"
            echo
            echo "### この run の capture.scap に入りうるもの"
            echo
            echo "- \`falco-actions\` の stop action (analyze モード) は capture.scap を"
            echo "  無条件に \`capture\` という名前のアーティファクトとしてアップロードする。"
            echo "  このワークフローはアップロード後すぐに GitHub API で削除するが、削除完了"
            echo "  までの数秒〜数十秒は public リポジトリで誰でもダウンロードできる。"
            echo "- \`upload_raw_capture: true\` の場合、capture.scap は"
            echo "  \`telemetry-falco-analyze\` として \`retention-days: 1\` の間 (この場合のみ"
            echo "  1 日に短縮される。false のときは 7 日)、継続的に"
            echo "  ダウンロード可能になる。"
            echo "- capture.scap は snaplen 256 の生 syscall キャプチャで、カナリア値"
            echo "  (\`CANARY_SCAP\` など。すべて \`CNRY-\` プレフィックスの偽物でリポジトリに"
            echo "  コミット済み) がそのまま混入する想定。"
            echo
            echo "### この run に実在する認証情報 (2つのみ) と、その実効的な価値"
            echo
            echo "| トークン | 宣言権限 / 有効範囲 | 失効タイミング | 悪用の本命経路 |"
            echo "| --- | --- | --- | --- |"
            echo "| \`GITHUB_TOKEN\` | \`contents: read\` のみ (このリポジトリの permissions 宣言)。public repo では誰でも同じ読み取りができる情報への権限に過ぎない | ジョブ完了時に失効 | (該当なし。write 系権限を宣言していない) |"
            echo "| \`ACTIONS_RUNTIME_TOKEN\` | run 中のみ有効な内部トークン | run 終了時 | \`actions/cache\` への汚染が本命だが、このリポジトリは \`actions/cache\` を使っていないためその経路は存在しない |"
            echo
            echo "\`id-token: write\` を宣言していないため \`ACTIONS_ID_TOKEN_REQUEST_TOKEN\`"
            echo "は存在しない。"
            echo
            echo "**この評価はこのリポジトリの現状に依存する。** リポジトリに本物の secret を"
            echo "追加した場合、\`contents: write\` / \`id-token: write\` を宣言した場合、"
            echo "\`actions/cache\` を使い始めた場合は、この判断を再評価すること"
            echo "(詳細は docs/SAFETY.md 6節 / このファイル冒頭のコメント)。"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Checkout cicd-runtime-testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Falco (analyze mode / sysdig capture)
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752 # UNPINNED: falco-actions has no git tags, see README
        with:
          mode: analyze
          verbose: true

      - name: Run detection scenarios
        shell: bash
        env:
          CANARY_ENV: ${{ secrets.CANARY_ENV }}
        run: |
          set -uo pipefail
          echo "::group::00-seed"
          bash scenarios/00-seed.sh
          echo "::endgroup::"

          echo "::group::01-credential-access"
          bash scenarios/01-credential-access.sh
          echo "::endgroup::"

          echo "::group::02-exfil"
          bash scenarios/02-exfil.sh
          echo "::endgroup::"

          echo "::group::03-npm-postinstall"
          npm install --no-audit --no-fund ./scenarios/03-npm-postinstall || true
          echo "::endgroup::"

          echo "::group::04-persistence"
          bash scenarios/04-persistence.sh
          echo "::endgroup::"

          echo "::group::05-memfd-exec"
          bash scenarios/05-memfd-exec.sh
          echo "::endgroup::"

          echo "::group::06-anti-forensics"
          bash scenarios/06-anti-forensics.sh
          echo "::endgroup::"

      - name: Stop Falco (analyze mode) — uploads capture.scap + hashes
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752 # UNPINNED: falco-actions has no git tags, see README
        with:
          mode: analyze
          verbose: true

  analyze:
    name: "analyze (falco replay)"
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # analyze action の "Retrieve Job Info using GitHub API" ステップが
      # jobs API を呼ぶため read が必要。write にしているのは、このジョブの
      # 最終ステップ (Enforce artifact retention) が "capture" / "hashes"
      # アーティファクトを削除するため (write は read を包含する)。
      actions: write
    steps:
      - name: Checkout falco-actions (for its bundled CI/CD rule file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: falcosecurity/falco-actions
          ref: 558a3ceeee9403e1c875ffbeb704c34c93e24752 # UNPINNED: must match the same commit used for the uses: pins above, see README
          path: _falco-actions-src

      - name: "Preflight: falcosecurity/falco-no-driver:0.39.2 タグの実在確認"
        # analyze action もイメージを falcosecurity/falco-no-driver に
        # ハードコードしている (falco-actions/analyze/action.yaml)。存在しない
        # タグを指定すると action の奥深くで `docker: ... manifest unknown` と
        # exit 125 になり原因がわかりにくい (今回報告された障害そのもの)。
        # ここで先に Docker Hub のタグ API を叩いて実在を確認し、無ければ
        # ここで明確に落とす。ネットワーク障害や rate limit で preflight 自体が
        # 失敗した場合は、テストの可用性を落とさないよう警告のみで続行する。
        shell: bash
        env:
          FALCO_VERSION: "0.39.2"
        run: |
          set -uo pipefail
          API_URL="https://hub.docker.com/v2/repositories/falcosecurity/falco-no-driver/tags?page_size=100&ordering=last_updated"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' --max-time 20 "$API_URL" 2>/dev/null)"
          CURL_EXIT=$?
          HTTP_CODE="${HTTP_CODE:-000}"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            echo "::warning title=falco-no-driver tag preflight skipped::Docker Hub API (${API_URL}) への接続に失敗しました (curl exit=${CURL_EXIT}, HTTP ${HTTP_CODE})。ネットワーク障害または rate limit の可能性があるため、preflight をスキップしてワークフローを続行します。falco-version=${FALCO_VERSION} が実在しない場合、後続のステップが manifest not found で失敗する可能性があります。"
            {
              echo "### preflight: falcosecurity/falco-no-driver:${FALCO_VERSION} (skipped)"
              echo ""
              echo "Docker Hub API への接続に失敗しました (curl exit=${CURL_EXIT}, HTTP ${HTTP_CODE})。"
              echo "ネットワーク障害または rate limit の可能性があるため、確認をスキップして続行しました。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$FALCO_VERSION" "$RESPONSE_FILE" "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import contextlib
          import json
          import re
          import sys

          falco_version, response_file, summary_file = sys.argv[1], sys.argv[2], sys.argv[3]

          # docs/REQUIRED-FIXES.md R-5: $GITHUB_STEP_SUMMARY は check-runs API
          # から取得できないため、判定内容を summary にしか書かないと、
          # アーティファクト失効後に結果を復元できない。summary への追記と
          # 同じ内容を stdout にも出し、ジョブログ側にも残す
          # (shell 側の `| tee -a "$GITHUB_STEP_SUMMARY"` と同じ意図)。
          @contextlib.contextmanager
          def open_summary(path):
              with open(path, "a", encoding="utf-8") as _f:
                  class _Tee:
                      @staticmethod
                      def write(text):
                          _f.write(text)
                          sys.stdout.write(text)
                  yield _Tee

          try:
              with open(response_file, encoding="utf-8") as f:
                  data = json.load(f)
              results = data.get("results", [])
              if not isinstance(results, list):
                  raise ValueError("results is not a list")
              tag_map = {t["name"]: t for t in results if isinstance(t, dict) and "name" in t}
          except Exception as e:
              msg = (
                  f"Docker Hub API のレスポンス解析に失敗しました ({e})。"
                  f"確認をスキップして続行します。"
              )
              print(f"::warning title=falco-no-driver tag preflight skipped::{msg}")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco-no-driver:{falco_version} (skipped)\n\n")
                  s.write(f"{msg}\n")
              sys.exit(0)

          semver_re = re.compile(r"^\d+\.\d+\.\d+$")
          numeric_tags = sorted(
              (name for name in tag_map if semver_re.match(name)),
              key=lambda v: [int(p) for p in v.split(".")],
          )

          if falco_version in tag_map:
              tag = tag_map[falco_version]
              last_pushed = tag.get("tag_last_pushed") or tag.get("last_updated") or "unknown"
              print(f"preflight OK: falcosecurity/falco-no-driver:{falco_version} exists (tag_last_pushed={last_pushed})")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco-no-driver:{falco_version}\n\n")
                  s.write(f"- Docker Hub にタグが実在することを確認しました。\n")
                  s.write(f"- 最終 push (`tag_last_pushed`): `{last_pushed}`\n\n")
              sys.exit(0)
          else:
              available = ", ".join(numeric_tags) if numeric_tags else "(取得できたページ内に数値タグが見つかりませんでした)"
              msg = (
                  f"falcosecurity/falco-no-driver:{falco_version} は Docker Hub に存在しません "
                  f"(manifest unknown になります)。利用可能な数値タグ: {available}"
              )
              print(f"::error title=falco-no-driver tag not found::{msg}")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco-no-driver:{falco_version} (NOT FOUND)\n\n")
                  s.write(f"- タグが存在しません。利用可能な数値タグ: {available}\n\n")
              sys.exit(1)
          PYEOF

      - name: Analyze capture
        id: analyze
        # falco_cicd_rules.yaml (required_engine_version: 0.43.0) を
        # falco-version: 0.39.2 (falco-no-driver で確認できる最新版) に
        # 読ませる。0.39.2 < 0.43.0 のため、falco がルールファイルの
        # ロードを拒否する可能性がある。continue-on-error はその「拒否」の
        # 実際の挙動 (起動失敗/警告のみで動く等) を観測するためのもので、
        # ジョブ全体を落とさない (下の "Record required_engine_version
        # hypothesis outcome" ステップで結果を記録する)。
        continue-on-error: true
        uses: falcosecurity/falco-actions/analyze@558a3ceeee9403e1c875ffbeb704c34c93e24752 # UNPINNED: falco-actions has no git tags, see README
        with:
          falco-version: "0.39.2" # falcosecurity/falco-no-driver の実際の上限 (メンテナンス終了)。ファイル冒頭のコメント参照
          # 明示的に渡さないと CI/CD 特化ルールが一切ロードされないため必須。
          # 絶対パスにしているのは、analyze action がこの値を
          # `docker run -v $CUSTOM_RULE_FILE:/etc/falco/rules.d/custom_rules.yaml`
          # にそのまま使うため。相対パスを渡すと Docker が名前付きボリューム
          # として解釈してしまう既知の落とし穴があるため避ける。
          custom-rule-file: ${{ github.workspace }}/_falco-actions-src/rules/falco_cicd_rules.yaml
          # T2 (何が取得・閲覧できるか) を確認するため、抽出できる情報は
          # すべて有効化する。
          extract-connections: true
          extract-processes: true
          extract-dns: true
          extract-containers: true
          extract-written-files: true
          extract-chisels: true
          extract-hashes: true
          verbose: true

      - name: "Record required_engine_version hypothesis outcome (T1 中核観測)"
        # falco_cicd_rules.yaml (required_engine_version: 0.43.0) を、
        # falco-actions が実際に使える上限バージョン (falco-version: 0.39.2)
        # のエンジンに読ませた結果を記録する。「falco-actions は自身の同梱
        # CI/CD ルールが要求するエンジンバージョンを満たすイメージを pull
        # できない可能性が高い」という仮説の検証データ。ロード成功/拒否/
        # 警告のみのいずれだったかは "Analyze capture" ステップの生ログ
        # (verbose: true) を目視確認する必要がある (falco の起動出力は
        # ワークフロー側からファイルとして回収できないため)。ここでは
        # ステップの outcome と、生成された telemetry の有無を手がかりとして
        # job summary に残す。
        if: always()
        run: |
          set -uo pipefail
          PROC_HAS_CONTENT="unknown"
          if [ -s /tmp/proc.txt ]; then
            PROC_HAS_CONTENT="yes (/tmp/proc.txt is non-empty)"
          elif [ -f /tmp/proc.txt ]; then
            PROC_HAS_CONTENT="no (/tmp/proc.txt exists but is empty)"
          else
            PROC_HAS_CONTENT="no (/tmp/proc.txt was not created)"
          fi
          {
            echo ""
            echo "## required_engine_version 0.43.0 vs falco 0.39.2 (T1 中核観測)"
            echo ""
            echo "- falco-actions 同梱の CI/CD ルール (rules/falco_cicd_rules.yaml) の"
            echo "  \`required_engine_version\`: \`0.43.0\`"
            echo "- 実際に使ったエンジン (falco-version): \`0.39.2\`"
            echo "  (falcosecurity/falco-no-driver で確認できる事実上の上限)"
            echo "- \`Analyze capture\` ステップの outcome: \`${{ steps.analyze.outcome }}\`"
            echo "- 傍証: sysdig capture から抽出された \`/tmp/proc.txt\` の有無: ${PROC_HAS_CONTENT}"
            echo "  (falco 自体が起動・ルール評価を完了していれば、通常はここが"
            echo "  空でなくなるはず。空、またはステップ自体が failure の場合は"
            echo "  required_engine_version による拒否を疑う根拠になる)"
            echo ""
            echo "**要手動確認**: \`Analyze capture\` ステップの生ログ (verbose 出力) に"
            echo "\`required_engine_version\` / \`engine version\` に関する記述が無いか確認し、"
            echo "docs/RESULTS-TEMPLATE.md の該当欄 (ロード成功 / 拒否 / 警告のみで通過) を埋めること。"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect telemetry (T2)
        id: collect_telemetry
        if: always()
        run: |
          set -uo pipefail
          mkdir -p telemetry
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" telemetry/job-summary.md
          fi

          # 期待するテレメトリファイル (extract-* / hashes 入力をすべて true
          # にしているため、9 ファイルすべてが期待値)。"Analyze capture"
          # ステップには continue-on-error: true が付いている
          # (required_engine_version の不整合を実際に観測するため) ため、
          # analyze action がエンジンのロード拒否等で実質的に失敗しても
          # ジョブ自体は続行してしまう。その結果 telemetry-falco-analyze の
          # 中身が job-summary.md だけという「収集不完全なのに成功扱い」の
          # 成果物が上がりうる (sensor-monitor.yml / sensor-enforce.yml で
          # 実地確認した不具合と同種のもの)。ここで期待ファイルの取得可否を
          # telemetry-manifest.txt / job summary に明記し、1つも取得できて
          # いなければこのジョブを失敗させる (docs/SPEC.md §6)。
          expected_files="hashes.txt outbound.txt proc.txt files_written.txt dns_extract_json.txt containers.txt udp_extract.txt top_connection.txt topprocs_net.txt"
          total=0
          found=0
          missing_names=""

          {
            echo "# telemetry-manifest.txt"
            echo "# analyze job of falco-analyze.yml (run ${{ github.run_id }})"
            echo "# format: <expected-file>: OK | MISSING"
          } > telemetry/telemetry-manifest.txt

          for f in ${expected_files}; do
            total=$((total + 1))
            if [ -f "/tmp/${f}" ]; then
              cp "/tmp/${f}" "telemetry/${f}"
              found=$((found + 1))
              echo "${f}: OK" >> telemetry/telemetry-manifest.txt
            else
              missing_names="${missing_names}${f} "
              echo "${f}: MISSING" >> telemetry/telemetry-manifest.txt
            fi
          done

          if [ "${{ inputs.upload_raw_capture }}" = "true" ]; then
            if [ -f /tmp/capture.scap ]; then
              echo "upload_raw_capture=true: including raw capture.scap in telemetry-falco-analyze"
              cp /tmp/capture.scap telemetry/capture.scap
              echo "capture.scap: OK (upload_raw_capture=true)" >> telemetry/telemetry-manifest.txt
            else
              echo "::warning::upload_raw_capture=true but /tmp/capture.scap was not found; capture.scap will be missing from telemetry-falco-analyze"
              echo "capture.scap: MISSING (upload_raw_capture=true but /tmp/capture.scap not found)" >> telemetry/telemetry-manifest.txt
            fi
          else
            echo "upload_raw_capture=false (default): raw capture.scap is not included (docs/SPEC.md §1-6)"
            echo "capture.scap: N/A (upload_raw_capture=false)" >> telemetry/telemetry-manifest.txt
          fi

          {
            echo "## Telemetry collection summary (T2)"
            echo ""
            echo "- extracted files collected: ${found} / ${total}"
            if [ -n "${missing_names}" ]; then
              echo "- missing: ${missing_names}"
            fi
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "${found}" -eq 0 ]; then
            echo "::error::telemetry collection failed: none of the expected extracted telemetry files (${expected_files}) were produced by the Analyze capture step (outcome=${{ steps.analyze.outcome }}). See telemetry-manifest.txt / job summary."
            echo "❌ **0 / ${total} expected extracted telemetry files collected. Failing this job (docs/SPEC.md §6).**" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "${found}" -lt "${total}" ]; then
            echo "::warning::telemetry collection partial: missing ${missing_names}(collected ${found}/${total}). See telemetry-manifest.txt in the uploaded telemetry-falco-analyze artifact."
            echo "⚠️ **${found} / ${total} expected extracted telemetry files collected. Missing: ${missing_names}(see telemetry-manifest.txt).**" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **${found} / ${total} expected extracted telemetry files collected.**" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload telemetry-falco-analyze
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-falco-analyze
          path: telemetry/
          if-no-files-found: warn
          # docs/REQUIRED-FIXES.md R-6: 加工済みテレメトリは 7 日保持する。
          # ただし upload_raw_capture=true のときは、このアーティファクトに
          # **生の capture.scap** (シークレットを含みうる。docs/SPEC.md §1-6)
          # が含まれるため、その場合だけ従来どおり 1 日に戻す。
          retention-days: ${{ (inputs.upload_raw_capture == true || inputs.upload_raw_capture == 'true') && 1 || 7 }}

      - name: Enforce artifact retention (delete raw "capture" / "hashes" uploaded by falco-actions)
        # falco-actions/stop (analyze mode) uploads "capture" (capture.scap)
        # and "hashes" unconditionally, with no retention-days override and
        # no way to suppress the upload from our side (see the workflow
        # header comment). We already folded the information we want to
        # keep into telemetry-falco-analyze (retention-days: 1, and only
        # containing capture.scap when upload_raw_capture=true), so the
        # originals are deleted here to minimize retention/exposure
        # (docs/SPEC.md §1-5, §1-6).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for name in capture hashes; do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=${name}" \
              --jq '.artifacts[0].id // empty' || true)
            if [ -n "${id}" ]; then
              echo "Deleting artifact '${name}' (id=${id}) uploaded by falco-actions/stop"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || \
                echo "::warning::failed to delete artifact '${name}' (id=${id}); delete it manually"
            else
              echo "Artifact '${name}' not found (already absent or upload failed); nothing to delete"
            fi
          done
