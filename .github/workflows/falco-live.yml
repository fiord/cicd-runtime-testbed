# .github/workflows/falco-live.yml
#
# 検証目的 (docs/SPEC.md T1 / §8):
#   falco-actions の live モードで、cicd-runtime-testbed の検知シナリオ
#   (scenarios/00〜06) を実行した際に何が検知されるかを確認する。
#
#   さらに、falco-actions が同梱する CI/CD ルール
#   (falcosecurity/falco-actions の rules/falco_cicd_rules.yaml) は先頭に
#   `required_engine_version: 0.43.0` を宣言している。このワークフローは
#   `falco-version` を 0.39.0 / 0.39.2 の matrix にして、この
#   required_engine_version の宣言と実際に使う falco エンジンのバージョンが
#   食い違った場合に「実際に問題が起きるのか」(ルールが黙って無効化される/
#   起動が失敗する/警告のみで動く、等)を実地で確認する。fail-fast は無効化し、
#   片方の falco-version が失敗してももう片方の結果を必ず得られるようにする。
#
#   なぜ upstream (`live` ジョブ) は 0.39.x が上限か: falco-actions の
#   start/analyze action は使用イメージを `IMAGE="falcosecurity/falco-no-driver"`
#   にハードコードしており (falcosecurity/falco-actions の start/action.yaml,
#   analyze/action.yaml)、このイメージは Docker Hub 上の数値バージョンタグの
#   最大が `0.39.2` で止まっている (latest の最終 push も 2024-11-21 で、
#   事実上メンテナンスが止まっている)。したがって `required_engine_version:
#   0.43.0` を満たす falco-version を upstream の matrix に含めることは
#   そもそもできず、0.39.0 (旧: required_engine_version との不整合を見る側) と
#   0.39.2 (falco-no-driver で確認できる最新版) の 2 点で比較する。
#
#   一方 `live-forked` ジョブ (fork 修正版) は、fiord/falco-actions の
#   fix/cicd-rules-mount-path ブランチ側で使用イメージそのものを
#   `falcosecurity/falco-no-driver` から、現在も更新が続いている falco 本体
#   イメージ `falcosecurity/falco` に切り替え済みである。そのため `live-forked`
#   ジョブは `falco-version: "0.44.1"` (falcosecurity/falco の Docker Hub 上の
#   実際の最新、2026-06-11 push、Docker Hub API で確認済み) を指定でき、
#   required_engine_version: 0.43.0 を満たすエンジンで実行できる。
#
#   なお、以前この `live-forked` ジョブはイメージが切り替わった後も
#   `falco-version: "0.39.2"` を渡したままだったため、結局
#   `falcosecurity/falco:0.39.2` という古い Falco を pull し続けており、
#   本来検証したかった「新しい Falco がカーネル 6.17 で動くか」を一度も確認
#   できていなかった (run 32606439283 の実測:
#   `Status: Downloaded newer image for falcosecurity/falco:0.39.2` /
#   `Falco container was seen running but is no longer alive after the
#   recheck.`)。falco-version を実際の最新である 0.44.1 に合わせたのはこの
#   ためである。
#
#   詳細は各 matrix ジョブの "Preflight" ステップと docs/RESULTS-TEMPLATE.md を
#   参照。
#
#   custom-rule-file は指定しない: start action の `cicd-rules` 入力は
#   デフォルト true であり、live モードでは falco-actions 同梱の CI/CD
#   ルールセットが自動的にマウントされる (falco-actions/start/action.yaml
#   参照)。ここではその「デフォルト動作」をそのまま検証する。
#
#   --- 上流バグと fork 修正版の並行比較 (このワークフローの中核的な追加目的) ---
#
#   falcosecurity/falco-actions の start/action.yaml:70 には既知のバグがある。
#   CI/CD ルール (cicd-rules, 既定 true) をマウントする行が
#
#     -v ${{github.action_path}}/rules/falco_cicd_rules.yaml:/etc/falco/rules.d/cicd_rules.yaml
#
#   となっているが、`github.action_path` は action.yaml 自身が置かれている
#   ディレクトリ (= リポジトリの start/ 配下) を指す。一方ルールファイルの実体は
#   リポジトリ直下の rules/ 配下にあり、start/rules/... というパスは存在しない。
#   存在しないパスを bind mount のソースに指定すると Docker はソース側に空
#   ディレクトリを暗黙に作ってそれをマウントするため、マウント先
#   (/etc/falco/rules.d/cicd_rules.yaml) が空ディレクトリに置き換わり、CI/CD
#   ルールは一度もロードされない。cicd-rules は既定 true なので、これは
#   「デフォルト設定で使うと検知が 0 件になる」というバグである
#   (実測: run 32550655759。起動ログには標準ルール 2 ファイルしか出ない)。
#
#   このバグの修正版を fiord/falco-actions (public fork) の commit
#   360d62c72985b790bff96abde043b14ae053efe5 に用意した
#   (https://github.com/fiord/falco-actions/commit/360d62c72985b790bff96abde043b14ae053efe5)。
#   マウント元を `${{github.action_path}}/../rules/falco_cicd_rules.yaml` に
#   修正しており、stop/action.yaml や analyze/action.yaml が同種のリポジトリ
#   ルート参照で既に使っているパターンに揃えたもの。
#
#   `uses:` には式 (${{ matrix.* }} 等) を使えない (GitHub Actions の制約) ため、
#   matrix で action の参照先 (upstream / fork) を切り替えることはできない。
#   そのため upstream 用の `live` ジョブ (matrix: 0.39.0 / 0.39.2、従来どおり)
#   とは別に、fork 修正版のみを使う `live-forked` ジョブ (falco-version 固定で
#   0.44.1 の 1 leg) を追加し、次の 3 leg を同一 run 内で並べて比較する:
#
#     | leg                    | action の参照先                                              | falco-version |
#     | ----------------------- | ------------------------------------------------------------ | ------------- |
#     | upstream / 0.39.0       | falcosecurity/falco-actions/...@558a3ceeee9403e1c875ffbeb704c34c93e24752 | 0.39.0        |
#     | upstream / 0.39.2       | 同上                                                            | 0.39.2        |
#     | fork-fixed / 0.44.1     | fiord/falco-actions/...@fix/cicd-rules-mount-path (branch)      | 0.44.1        |
#
#   --- `live-forked` ジョブが検証したい3点 ---
#
#   1. 維持されているイメージ (falcosecurity/falco) の新しい Falco
#      (0.44.1) なら、現在のランナーのカーネル (6.17) で起動し続けられるか
#   2. `cicd-rules` のパス修正 (start/action.yaml:70 の
#      github.action_path のずれの修正) により CI/CD 特化ルールがロードされるか
#   3. 実際に検知イベントが出るか
#
#   --- 検証用の一時的な例外 (docs/SPEC.md §8 / docs/SAFETY.md の「uses: は全て
#   コミット SHA でピン留めする」方針に対する意図的な例外) ---
#
#   `live-forked` ジョブの action 参照先は、上の修正コミット
#   (360d62c72985b790bff96abde043b14ae053efe5) への SHA pin ではなく、
#   fiord/falco-actions の `fix/cicd-rules-mount-path` ブランチへの参照にして
#   ある。このブランチには継続的に追加修正を入れている最中で、そのたびに
#   このリポジトリの SHA を追いかけて更新するのは非効率なため。参照先は
#   自分 (fiord) が管理する fork のブランチであり、第三者のリポジトリでは
#   ない。**検証が完了し、fork 側の修正が安定したら、必ずコミット SHA pin に
#   戻すこと。** upstream (`falcosecurity/falco-actions`、`live` ジョブ) 側の
#   参照は SHA pin のまま変更しない。詳細は該当ステップ直上のコメントと
#   docs/SAFETY.md のチェックリストを参照。
#
#   `live-forked` ジョブは `live` ジョブと処理内容 (シナリオ実行・テレメトリ収集・
#   preflight) がほぼ重複するが、可読性を優先してあえて重複させている。
#   両ジョブの差分は「action の参照先」「falco-version」「テレメトリアーティファクト名」
#   「preflight の対象イメージ (falcosecurity/falco-no-driver か falcosecurity/falco か)」
#   の 4 点のみになるようにコピーしてある。両ジョブに「CI/CD ルールがロードされたか」
#   のアサーション (非失敗、観測目的) を追加し、job summary を見比べればバグの
#   影響が一目で分かるようにしている。
#
# トリガーは workflow_dispatch のみ。public repo で push / PR に反応して
# 不用意に起動しないようにするため (docs/SPEC.md §8)。

name: "falco-live: detection scenarios (live mode, engine-version matrix + upstream/fork comparison)"

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  live:
    name: "live / upstream falco ${{ matrix.falco-version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # falco-actions の stop action (live モード) は、Falco イベントを
      # ジョブの各ステップに対応付けるため GitHub API (jobs) を呼ぶ。
      # README の注記: "actions: read permission is used to contact a
      # Github endpoint to perform a best-effort correlation".
      actions: read
    strategy:
      fail-fast: false
      # falcosecurity/falco-no-driver (falco-actions がハードコードして使う
      # イメージ) は Docker Hub 上の数値タグが 0.39.2 で止まっている
      # (メンテナンス終了、latest の最終 push も 2024-11-21)。0.40 以降の
      # タグは存在しないため 0.43.0 は指定できない。詳細はファイル冒頭のコメント参照。
      matrix:
        falco-version: ["0.39.0", "0.39.2"]
    steps:
      - name: Checkout cicd-runtime-testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Preflight: falcosecurity/falco-no-driver:${{ matrix.falco-version }} タグの実在確認"
        # falco-actions/start はイメージを falcosecurity/falco-no-driver に
        # ハードコードしている (falco-actions/start/action.yaml)。このイメージは
        # 数値タグの最大が 0.39.2 で公開が止まっているため、存在しないタグを
        # 指定すると action の奥深くで `docker: ... manifest unknown` と
        # exit 125 になり原因がわかりにくい (今回の障害そのもの)。ここで先に
        # Docker Hub のタグ API を叩いて実在を確認し、無ければここで明確に
        # 落とす。ネットワーク障害や rate limit で preflight 自体が失敗した
        # 場合は、テストの可用性を落とさないよう警告のみで続行する。
        shell: bash
        env:
          FALCO_VERSION: ${{ matrix.falco-version }}
        run: |
          set -uo pipefail
          API_URL="https://hub.docker.com/v2/repositories/falcosecurity/falco-no-driver/tags?page_size=100&ordering=last_updated"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' --max-time 20 "$API_URL" 2>/dev/null)"
          CURL_EXIT=$?
          HTTP_CODE="${HTTP_CODE:-000}"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            echo "::warning title=falco-no-driver tag preflight skipped::Docker Hub API (${API_URL}) への接続に失敗しました (curl exit=${CURL_EXIT}, HTTP ${HTTP_CODE})。ネットワーク障害または rate limit の可能性があるため、preflight をスキップしてワークフローを続行します。falco-version=${FALCO_VERSION} が実在しない場合、後続のステップが manifest not found で失敗する可能性があります。"
            {
              echo "### preflight: falcosecurity/falco-no-driver:${FALCO_VERSION} (skipped)"
              echo ""
              echo "Docker Hub API への接続に失敗しました (curl exit=${CURL_EXIT}, HTTP ${HTTP_CODE})。"
              echo "ネットワーク障害または rate limit の可能性があるため、確認をスキップして続行しました。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$FALCO_VERSION" "$RESPONSE_FILE" "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import contextlib
          import json
          import re
          import sys

          falco_version, response_file, summary_file = sys.argv[1], sys.argv[2], sys.argv[3]

          # docs/REQUIRED-FIXES.md R-5: $GITHUB_STEP_SUMMARY は check-runs API
          # から取得できないため、判定内容を summary にしか書かないと、
          # アーティファクト失効後に結果を復元できない。summary への追記と
          # 同じ内容を stdout にも出し、ジョブログ側にも残す
          # (shell 側の `| tee -a "$GITHUB_STEP_SUMMARY"` と同じ意図)。
          @contextlib.contextmanager
          def open_summary(path):
              with open(path, "a", encoding="utf-8") as _f:
                  class _Tee:
                      @staticmethod
                      def write(text):
                          _f.write(text)
                          sys.stdout.write(text)
                  yield _Tee

          try:
              with open(response_file, encoding="utf-8") as f:
                  data = json.load(f)
              results = data.get("results", [])
              if not isinstance(results, list):
                  raise ValueError("results is not a list")
              tag_map = {t["name"]: t for t in results if isinstance(t, dict) and "name" in t}
          except Exception as e:
              msg = (
                  f"Docker Hub API のレスポンス解析に失敗しました ({e})。"
                  f"確認をスキップして続行します。"
              )
              print(f"::warning title=falco-no-driver tag preflight skipped::{msg}")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco-no-driver:{falco_version} (skipped)\n\n")
                  s.write(f"{msg}\n")
              sys.exit(0)

          semver_re = re.compile(r"^\d+\.\d+\.\d+$")
          numeric_tags = sorted(
              (name for name in tag_map if semver_re.match(name)),
              key=lambda v: [int(p) for p in v.split(".")],
          )

          if falco_version in tag_map:
              tag = tag_map[falco_version]
              last_pushed = tag.get("tag_last_pushed") or tag.get("last_updated") or "unknown"
              print(f"preflight OK: falcosecurity/falco-no-driver:{falco_version} exists (tag_last_pushed={last_pushed})")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco-no-driver:{falco_version}\n\n")
                  s.write(f"- Docker Hub にタグが実在することを確認しました。\n")
                  s.write(f"- 最終 push (`tag_last_pushed`): `{last_pushed}`\n\n")
              sys.exit(0)
          else:
              available = ", ".join(numeric_tags) if numeric_tags else "(取得できたページ内に数値タグが見つかりませんでした)"
              msg = (
                  f"falcosecurity/falco-no-driver:{falco_version} は Docker Hub に存在しません "
                  f"(manifest unknown になります)。利用可能な数値タグ: {available}"
              )
              print(f"::error title=falco-no-driver tag not found::{msg}")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco-no-driver:{falco_version} (NOT FOUND)\n\n")
                  s.write(f"- タグが存在しません。利用可能な数値タグ: {available}\n\n")
              sys.exit(1)
          PYEOF

      - name: Start Falco (live mode)
        id: start_falco
        # required_engine_version との不整合が実際に何を起こすかを
        # このワークフローで確認したいので、起動失敗そのものでジョブ全体を
        # 落とさない。後続ステップは falco が起動していなくても実行され、
        # 「検知されなかった」という結果自体が観測データになる。
        continue-on-error: true
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752 # UNPINNED: falco-actions has no git tags, see README (upstream, falcosecurity/falco-actions, has the cicd-rules mount-path bug at start/action.yaml:70)
        with:
          mode: live
          falco-version: ${{ matrix.falco-version }}
          verbose: true

      - name: "Stream Falco logs to file (survive --rm container disappearance)"
        # docker run --rm -d の Falco コンテナは異常終了すると即座に消え、消える
        # 直前の docker logs 出力 (クラッシュ理由を含む最後の行) ごと失われる。
        # これを防ぐため、Start Falco の直後に docker logs -f をバックグラウンドで
        # 起動し、出力を /tmp/falco_stream.log に追記し続ける。このファイルは
        # コンテナが消えても残るため、後続の起動完了ポーリングとテレメトリ収集は
        # (docker logs を都度叩くのではなく) このファイルを主たる情報源として使う。
        # あわせて docker events もバックグラウンドで記録し、--rm のため
        # docker inspect では取れない終了コードを die イベントから拾えないか試みる。
        # バックグラウンドプロセスの PID は GITHUB_ENV に記録し、後続の
        # "Stop background log/event capture processes" ステップで確実に
        # 終了させる。観測目的のステップなので失敗させない。
        id: stream_falco_logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STREAM_LOG="/tmp/falco_stream.log"
          EVENTS_LOG="/tmp/falco_events_docker.log"
          : > "$STREAM_LOG"
          : > "$EVENTS_LOG"

          if docker ps -a --filter "name=falco" 2>/dev/null | grep -q falco; then
            nohup docker logs -f falco > "$STREAM_LOG" 2>&1 &
            STREAM_PID=$!
            disown "$STREAM_PID" 2>/dev/null || true
            echo "FALCO_STREAM_PID=${STREAM_PID}" >> "$GITHUB_ENV"
            echo "[stream] started 'docker logs -f falco' (pid=${STREAM_PID}) -> ${STREAM_LOG}"
          else
            echo "(falco container not found when starting log stream; Start Falco step likely failed)" >> "$STREAM_LOG"
            echo "[stream] falco container not found; nothing to stream."
          fi

          SINCE_TS=$(( $(date -u +%s) - 60 ))
          nohup docker events --filter "container=falco" --since "${SINCE_TS}" > "$EVENTS_LOG" 2>&1 &
          EVENTS_PID=$!
          disown "$EVENTS_PID" 2>/dev/null || true
          echo "FALCO_DOCKER_EVENTS_PID=${EVENTS_PID}" >> "$GITHUB_ENV"
          echo "[events] started 'docker events' recorder (pid=${EVENTS_PID}) -> ${EVENTS_LOG}"
          exit 0

      - name: "Capture Falco startup logs (required_engine_version check, T1)"
        # falco-actions 同梱の CI/CD ルール (rules/falco_cicd_rules.yaml) は
        # `required_engine_version: 0.43.0` を宣言している。一方 falco-actions が
        # 使える falco-no-driver イメージは 0.39.2 が事実上の上限 (ファイル冒頭の
        # コメント参照)。つまり「falco-actions は自身の同梱 CI/CD ルールが要求する
        # エンジンバージョンを満たすイメージを pull できない可能性が高い」という
        # 仮説が立つ。この仮説を検証するため、falco コンテナ起動直後のログから
        # required_engine_version / engine version 関連の記述の有無を拾い、
        # ロード成功・拒否・警告のみのいずれだったかの手がかりを job summary と
        # telemetry に残す (docs/RESULTS-TEMPLATE.md T1 の記入欄に対応)。
        #
        # ポーリングは docker logs を都度叩くのではなく /tmp/falco_stream.log
        # (直前のステップが docker logs -f で継続的に書き続けているファイル) の
        # 内容に対して行なう。コンテナが --rm で消えてもファイルは残るため、
        # クラッシュ直前の最後の出力まで確実に拾える。ポーリング間隔は 0.2秒
        # (旧: 1秒) に短縮し、取りこぼしを減らす。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG_FILE="/tmp/falco_start_logs.txt"
          MARKER_STATUS_FILE="/tmp/falco_startup_marker_status.txt"
          STREAM_LOG="/tmp/falco_stream.log"
          EVENTS_LOG="/tmp/falco_events_docker.log"
          STARTUP_TIMEOUT=60
          POLL_INTERVAL=0.2
          MARKER_REGEX="Enabled event sources|Opening 'syscall' source"

          {
            echo "# falco startup log capture (engine requirement check, falco-version=${{ matrix.falco-version }})"
            echo "# primary source: ${STREAM_LOG} (docker logs -f, streamed continuously since"
            echo "# right after Start Falco; content survives the --rm container disappearing)"
            echo ""
          } > "$LOG_FILE"

          STARTUP_MARKER_FOUND="no"
          CONTAINER_NEVER_STARTED="no"
          ITERS=0
          MAX_ITERS=$(awk -v t="$STARTUP_TIMEOUT" -v p="$POLL_INTERVAL" 'BEGIN{printf "%d", (t/p)+0.5}')

          if [ -f "$STREAM_LOG" ] && grep -q "falco container not found when starting log stream" "$STREAM_LOG" 2>/dev/null; then
            CONTAINER_NEVER_STARTED="yes"
          elif [ ! -f "$STREAM_LOG" ]; then
            echo "(warning: ${STREAM_LOG} not found; 'Stream Falco logs to file' step may not have run)" >> "$LOG_FILE"
          fi

          if [ "$CONTAINER_NEVER_STARTED" = "no" ] && [ -f "$STREAM_LOG" ]; then
            # 起動完了 (Falco がイベントソースを開き終える) を示すマーカーが
            # ストリームファイルに現れるまでポーリングする。
            while [ "$ITERS" -lt "$MAX_ITERS" ]; do
              if grep -qE "$MARKER_REGEX" "$STREAM_LOG" 2>/dev/null; then
                STARTUP_MARKER_FOUND="yes"
                break
              fi
              ITERS=$((ITERS + 1))
              sleep "$POLL_INTERVAL"
            done
          fi

          ELAPSED="$(awk -v i="$ITERS" -v p="$POLL_INTERVAL" 'BEGIN{printf "%.1f", i*p}')"
          DOCKER_PS_OUTPUT="$(docker ps -a --filter "name=falco" 2>&1 || true)"
          CONTAINER_ALIVE="no"
          if printf '%s' "$DOCKER_PS_OUTPUT" | grep -q falco; then
            CONTAINER_ALIVE="yes"
          fi

          {
            echo "## docker ps -a --filter name=falco (container status, checked after polling)"
            echo '```'
            echo "$DOCKER_PS_OUTPUT"
            echo '```'
            echo ""
            echo "## ${STREAM_LOG} (full content)"
            echo '```'
            if [ -f "$STREAM_LOG" ]; then
              cat "$STREAM_LOG"
            else
              echo "(not found)"
            fi
            echo '```'
            echo ""
            if [ "$CONTAINER_NEVER_STARTED" = "yes" ]; then
              echo "(falco container not found; Start Falco step likely failed — see its outcome)"
            elif [ "$STARTUP_MARKER_FOUND" = "yes" ]; then
              echo "[poll] startup completion marker detected after ~${ELAPSED}s (matched: ${MARKER_REGEX})."
            elif [ "$CONTAINER_ALIVE" = "yes" ]; then
              echo "[poll] startup completion marker NOT observed within ${STARTUP_TIMEOUT}s timeout; container is still present. Rule-loading outcome could not be confirmed from this log alone; captured logs may be incomplete."
            else
              echo "[poll] falco container is gone (docker run --rm; likely crashed). The stream log above was captured via 'docker logs -f' running continuously in the background since right after Start Falco, so it should contain everything Falco printed up to the moment it died — unlike a single docker logs snapshot, which would have been lost together with the container."
            fi
          } >> "$LOG_FILE"

          if [ "$CONTAINER_NEVER_STARTED" = "yes" ]; then
            HAS_ENGINE_MENTION="n/a"
            STARTUP_MARKER_FOUND="n/a"
          elif grep -qiE "required_engine_version|engine version|rules requiring" "$LOG_FILE"; then
            HAS_ENGINE_MENTION="yes"
          else
            HAS_ENGINE_MENTION="no"
          fi

          # docker events の die イベントから終了コードを拾えないか試みる
          # (--rm のため docker inspect では取得できない)。実機の Docker は
          # デフォルトのテキスト出力に `exitCode=N` を含むため、まずそれを
          # 探す。取れなければ (podman 環境など) JSON 系フォーマットで使われる
          # ContainerExitCode / exitCode キーも探す。どちらも見つからなくても
          # 失敗させない。
          EXIT_CODE_INFO="not captured"
          DIE_LINE=""
          if [ -f "$EVENTS_LOG" ] && [ -s "$EVENTS_LOG" ]; then
            DIE_LINE="$(grep -iE 'die' "$EVENTS_LOG" | grep -F 'falco' | tail -1 || true)"
            if [ -n "$DIE_LINE" ]; then
              EXIT_CODE="$(printf '%s' "$DIE_LINE" | grep -oE 'exitCode=[0-9]+' | head -1 || true)"
              if [ -z "$EXIT_CODE" ]; then
                RAW_CODE="$(printf '%s' "$DIE_LINE" | grep -oE '"?[Cc]ontainerExitCode"?[:= ]+"?[0-9]+"?' | grep -oE '[0-9]+' | tail -1 || true)"
                if [ -n "$RAW_CODE" ]; then
                  EXIT_CODE="ContainerExitCode=${RAW_CODE}"
                fi
              fi
              if [ -n "$EXIT_CODE" ]; then
                EXIT_CODE_INFO="${EXIT_CODE} (from docker events)"
              else
                EXIT_CODE_INFO="die event observed but no exit-code attribute could be parsed"
              fi
            fi
          fi

          {
            echo ""
            echo "## falco コンテナの終了コード (docker events, best-effort — --rm のため docker inspect 不可)"
            echo ""
            echo "- 終了コード: **${EXIT_CODE_INFO}**"
            if [ -n "$DIE_LINE" ]; then
              echo "  該当イベント行:"
              echo '  ```'
              echo "  ${DIE_LINE}"
              echo '  ```'
            fi
            if [ -f "$EVENTS_LOG" ] && [ -s "$EVENTS_LOG" ]; then
              echo "  ${EVENTS_LOG} の全内容:"
              echo '  ```'
              sed 's/^/  /' "$EVENTS_LOG"
              echo '  ```'
            else
              echo "  (${EVENTS_LOG} は空、または作成されなかった)"
            fi
          } >> "$LOG_FILE"

          printf '%s' "$STARTUP_MARKER_FOUND" > "$MARKER_STATUS_FILE"

          {
            echo ""
            echo "## required_engine_version 0.43.0 vs falco ${{ matrix.falco-version }} (T1 中核観測)"
            echo ""
            echo "falco-actions 同梱の CI/CD ルール (rules/falco_cicd_rules.yaml) は"
            echo "\`required_engine_version: 0.43.0\` を宣言しているが、falco-no-driver の"
            echo "公開停止により実際に使えるエンジンは \`0.39.2\` が上限。"
            echo "「falco-actions は自身の同梱 CI/CD ルールが要求するエンジンバージョンを"
            echo "満たすイメージを pull できない」という仮説の検証データ。"
            echo ""
            case "$HAS_ENGINE_MENTION" in
              yes)
                echo "- \`docker logs falco\` に required_engine_version / engine version への言及**あり**。"
                echo "  ルールがロード拒否または警告付きで扱われた可能性が高い。抜粋:"
                echo '  ```'
                grep -iE "required_engine_version|engine version|rules requiring" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              no)
                echo "- \`docker logs falco\` に required_engine_version / engine version への言及は"
                echo "  見つからなかった。警告なしでロードされたか、そもそもログに出ない形で"
                echo "  無視されたかは、このログだけでは切り分けられない。"
                echo "  telemetry の \`falco_start_logs.txt\` の全文と \`falco_events.json\`"
                echo "  (cicd_rules 由来のイベントが実際に発火しているか) を突き合わせて判断すること。"
                ;;
              *)
                echo "- falco コンテナが見つからなかった。Start Falco 自体が失敗したため、"
                echo "  ルールロードの成否そのものを確認できない。"
                ;;
            esac
            echo ""
            echo "## falco コンテナの終了コード (docker events, best-effort)"
            echo "- **${EXIT_CODE_INFO}**"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Assert (observational): CI/CD rules loaded?"
        # falcosecurity/falco-actions の start/action.yaml:70 の既知のバグ
        # (github.action_path の解決先が action.yaml のあるディレクトリ (start/)
        # を指すため、リポジトリ直下 rules/ への相対パスがずれ、存在しない
        # マウント元パスが Docker によって暗黙に空ディレクトリへ置き換わり、
        # CI/CD ルールファイルが一度もロードされない) を、起動ログから実地確認する。
        # 判定は「/tmp/falco_start_logs.txt (直前のステップが生成) に
        # cicd_rules.yaml または rules.d への言及が現れるか」で行なう。
        # 観測が目的のステップなので、ロードされていなくてもジョブを失敗させない
        # (結果を job summary に記録するだけ)。fork-fixed leg (live-forked ジョブ)
        # と同じ判定ロジックを使い、job summary を並べて見比べられるようにしている。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG_FILE="/tmp/falco_start_logs.txt"
          MARKER_STATUS_FILE="/tmp/falco_startup_marker_status.txt"
          ERROR_REGEX="required_engine_version|engine version|Runtime error|Invalid|cannot be loaded"

          CICD_LOADED="unknown"
          if [ -f "$LOG_FILE" ]; then
            if grep -qiE "cicd_rules\.yaml" "$LOG_FILE"; then
              CICD_LOADED="yes"
            elif grep -qiE "rules\.d" "$LOG_FILE"; then
              CICD_LOADED="maybe"
            else
              CICD_LOADED="no"
            fi
          else
            CICD_LOADED="n/a"
          fi

          ERROR_FOUND="no"
          if [ -f "$LOG_FILE" ] && grep -qiE "$ERROR_REGEX" "$LOG_FILE"; then
            ERROR_FOUND="yes"
          fi

          # 標準ルールセット (/etc/falco/falco_rules.yaml) がロードされたか
          # (docs/REQUIRED-FIXES.md R-4 / docs/TEST-PLAN.md「公平性:
          # ルールセットの母数」)。
          #
          # なぜ観測するのか: R-4 の監査本文は「live モードでは
          # cicd_rules.yaml しかロードしていない」としているが、falco の
          # 既定 falco.yaml の rules_files: は /etc/falco/falco_rules.yaml /
          # falco_rules.local.yaml / rules.d を含むため、標準ルールも
          # ロードされている**はず**である。falco 側の検知件数が
          # 1 種類しか出ない理由が「標準ルールが無いから」なのか
          # 「標準ルールはあるがこれらのシナリオに反応しないから」なのかで
          # 結論がまったく変わるので、推測せず実測で確定させる。
          #
          # これは falco の構成を変える変更ではなく、何がロードされたかを
          # 記録するだけの観測である (両ツールとも出荷時構成のまま測る、
          # という方針を崩さない)。
          #
          # 注意: パターン `falco_rules\.yaml` は `falco_cicd_rules.yaml`
          # には一致しない (後者は "cicd_rules.yaml" で終わる) ので、
          # 上の CICD_LOADED 判定と混同しない。
          STD_RULES="unknown"
          if [ -f "$LOG_FILE" ]; then
            if grep -qiE "falco_rules\.yaml" "$LOG_FILE"; then
              STD_RULES="yes"
            else
              STD_RULES="no_mention"
            fi
          else
            STD_RULES="n/a"
          fi

          STARTUP_MARKER="unknown"
          if [ -f "$MARKER_STATUS_FILE" ]; then
            STARTUP_MARKER="$(cat "$MARKER_STATUS_FILE")"
          fi

          # 3値判定: loaded / rejected (エラー語あり) / not_loaded (言及もエラーも無し)
          if [ "$ERROR_FOUND" = "yes" ]; then
            VERDICT="rejected"
          elif [ "$CICD_LOADED" = "yes" ] || [ "$CICD_LOADED" = "maybe" ]; then
            VERDICT="loaded"
          else
            VERDICT="not_loaded"
          fi

          # T-C: 後続の "Record leg detection-data outcome" ステップは別
          # ステップ (別シェル) なので、ここで確定した VERDICT をファイルに
          # 残しておかないと参照できない。既存の
          # /tmp/falco_startup_marker_status.txt と同じやり方に合わせる。
          printf '%s' "$VERDICT" > /tmp/falco_cicd_verdict.txt

          {
            echo ""
            echo "## CI/CD ルールはロードされたか (job: ${{ github.job }}, leg: upstream / falco ${{ matrix.falco-version }})"
            echo ""
            echo "action 参照先: \`falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752\`"
            echo "(upstream。start/action.yaml:70 に既知のマウントパスバグあり)。"
            echo ""
            case "$CICD_LOADED" in
              yes)
                echo "- \`cicd_rules.yaml\` への言及: **あり**。該当行:"
                echo '  ```'
                grep -iE "cicd_rules\.yaml" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              maybe)
                echo "- \`cicd_rules.yaml\` への直接の言及は無いが \`rules.d\` への言及はあった"
                echo "  (不明)。該当行:"
                echo '  ```'
                grep -iE "rules\.d" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              no)
                echo "- \`cicd_rules.yaml\` / \`rules.d\` への言及は起動ログに一切見つからなかった。"
                ;;
              *)
                echo "- 起動ログ (\`falco_start_logs.txt\`) が見つからず判定不能"
                echo "  (Start Falco 自体が失敗した可能性が高い)。"
                ;;
            esac
            echo ""
            echo "- エラー語 (\`required_engine_version\` / \`engine version\` / \`Runtime error\` /"
            echo "  \`Invalid\` / \`cannot be loaded\`) の有無: **${ERROR_FOUND}**"
            if [ "$ERROR_FOUND" = "yes" ]; then
              echo "  該当行:"
              echo '  ```'
              grep -iE "$ERROR_REGEX" "$LOG_FILE" | sed 's/^/  /' | head -20
              echo '  ```'
            fi
            echo ""
            echo "- 標準ルールセット (\`/etc/falco/falco_rules.yaml\`) への言及: **${STD_RULES}**"
            case "$STD_RULES" in
              yes)
                echo "  (falco 既定の \`rules_files:\` どおり標準ルールもロードされている。"
                echo "  したがって falco 側の発火種類数の少なさは「ルールが無いから」ではなく"
                echo "  「標準ルールがこれらのシナリオに反応しないから」である。該当行:)"
                echo '  ```'
                grep -iE "falco_rules\.yaml" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              no_mention)
                echo "  (起動ログに言及が無い。falco が読み込んだルールファイルを"
                echo "  逐一ログ出力しないバージョンの可能性もあるため、"
                echo "  **「ロードされていない」と断定はできない**。)"
                ;;
              *)
                echo "  (起動ログが無く判定不能。)"
                ;;
            esac
            echo ""
            echo "  → この観測は docs/TEST-PLAN.md「公平性: ルールセットの母数が違うため"
            echo "  検知件数は直接比較できない (R-4)」の根拠として使うこと。"
            echo ""
            echo "- 起動完了マーカー (\`Enabled event sources\` / \`Opening 'syscall' source\`) 検出: **${STARTUP_MARKER}**"
            case "$STARTUP_MARKER" in
              yes) echo "  (Falco は正常に起動しきったと判断できる)" ;;
              no) echo "  (60秒待っても現れなかった。起動が完了しなかったか、非常に遅延している可能性がある)" ;;
              n/a) echo "  (falco コンテナ自体が見つからなかった)" ;;
              *) echo "  (状態不明)" ;;
            esac
            echo ""
            echo "- **総合判定: \`${VERDICT}\`** (\`loaded\` / \`rejected\` / \`not_loaded\` の3値)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run detection scenarios
        shell: bash
        env:
          # docs/SPEC.md §3: CANARY_ENV のみ GitHub Secrets 経由。
          # Secret 未設定でも scenarios/lib/common.sh の load_canaries が
          # フォールバックしてくれる (README 参照)。
          CANARY_ENV: ${{ secrets.CANARY_ENV }}
        run: |
          set -uo pipefail
          echo "::group::00-seed"
          bash scenarios/00-seed.sh
          echo "::endgroup::"

          echo "::group::01-credential-access"
          bash scenarios/01-credential-access.sh
          echo "::endgroup::"

          echo "::group::02-exfil"
          bash scenarios/02-exfil.sh
          echo "::endgroup::"

          echo "::group::03-npm-postinstall"
          npm install --no-audit --no-fund ./scenarios/03-npm-postinstall || true
          echo "::endgroup::"

          echo "::group::04-persistence"
          bash scenarios/04-persistence.sh
          echo "::endgroup::"

          echo "::group::05-memfd-exec"
          bash scenarios/05-memfd-exec.sh
          echo "::endgroup::"

          echo "::group::06-anti-forensics"
          bash scenarios/06-anti-forensics.sh
          echo "::endgroup::"

      - name: "Drain window before stopping Falco"
        # 実測 (run 33311769634, live-forked leg) では "Run detection
        # scenarios" ステップの所要時間がわずか 1 秒で、直後の
        # "Capture Falco logs before stop (T1)" ステップが同じ秒に開始して
        # いた。つまりシナリオ実行の終了から Falco を止めるまでの間に
        # 一切の待ち時間が無かった。Falco の file_output はバッファリング
        # されることがあり、eBPF 経由のイベント処理にも遅延がありうるため、
        # この状態のままでは「0 件検知」という結果がシナリオを本当に
        # 見逃したのか、単に Falco がイベントを書き出す前に停止されて
        # しまっただけなのかを切り分けられない。ここで数秒待ってから
        # 停止することで、"0 件検知" という観測結果に意味を持たせる
        # (drain 不足による見かけ上のゼロと、本当の未検知を混同しない
        # ようにする)。
        if: always()
        shell: bash
        run: |
          echo "waiting 5s for Falco's buffered file_output / eBPF event processing to catch up with the scenarios that just ran, before Falco is stopped (run 33311769634: scenarios finished and Falco was stopped in the same second, with zero drain time)"
          sleep 5

      - name: "Capture Falco logs before stop (T1)"
        # Stop Falco の直前にもう一度 docker logs を取得する。起動直後には
        # まだ現れないエラー (ルール評価時のエラーなど、シナリオ実行中に発生
        # したもの) を捕捉するため。falco_start_logs.txt とは別ファイルに保存し、
        # 起動完了マーカー捕捉後にのみ発生し得る事象と比較できるようにする。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG_FILE="/tmp/falco_stop_logs.txt"
          {
            echo "# falco logs immediately before Stop Falco (falco-version=${{ matrix.falco-version }})"
            echo ""
          } > "$LOG_FILE"

          if docker ps -a --filter "name=falco" | grep -q falco; then
            if ! docker logs falco >> "$LOG_FILE" 2>&1; then
              echo "" >> "$LOG_FILE"
              echo "(docker logs falco failed just now; container may have disappeared between the check above and this call)" >> "$LOG_FILE"
            fi
          else
            echo "(falco container not found; it may have already been removed — e.g. docker run --rm after a crash — or Start Falco never succeeded)" >> "$LOG_FILE"
          fi

      - name: "Stop background log/event capture processes"
        # "Stream Falco logs to file" ステップで起動した docker logs -f /
        # docker events のバックグラウンドプロセスを、GITHUB_ENV に記録して
        # おいた PID を使って確実に終了させる。既に終了している場合や PID が
        # 記録されていない場合でも失敗させない。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -n "${FALCO_STREAM_PID:-}" ]; then
            kill "${FALCO_STREAM_PID}" 2>/dev/null || true
            echo "stopped docker logs -f stream (pid=${FALCO_STREAM_PID})"
          else
            echo "(FALCO_STREAM_PID not set; nothing to stop)"
          fi
          if [ -n "${FALCO_DOCKER_EVENTS_PID:-}" ]; then
            kill "${FALCO_DOCKER_EVENTS_PID}" 2>/dev/null || true
            echo "stopped docker events recorder (pid=${FALCO_DOCKER_EVENTS_PID})"
          else
            echo "(FALCO_DOCKER_EVENTS_PID not set; nothing to stop)"
          fi
          exit 0

      - name: Stop Falco (live mode) and build job summary
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752 # UNPINNED: falco-actions has no git tags, see README (upstream)
        with:
          mode: live
          verbose: true

      - name: Record engine-version matrix outcome in job summary
        if: always()
        run: |
          {
            echo ""
            echo "## falco-live matrix note"
            echo "- \`falco-version\`: \`${{ matrix.falco-version }}\`"
            echo "- action source: upstream falcosecurity/falco-actions@558a3ceeee9403e1c875ffbeb704c34c93e24752"
            echo "- required_engine_version of the bundled CI/CD rules: \`0.43.0\`"
            echo "- falcosecurity/falco-no-driver の実際の上限 (Docker Hub, メンテナンス終了): \`0.39.2\`"
            echo "- \`Start Falco\` step outcome: \`${{ steps.start_falco.outcome }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Record leg detection-data outcome"
        # T-C: "Assert (observational): CI/CD rules loaded?" の3値判定
        # (loaded / rejected / not_loaded、/tmp/falco_cicd_verdict.txt に
        # 保存済み) と、falco_events.json の有無・行数を突き合わせ、
        # 「このレグは検知データを一切生成しなかった」ことを job 全体の
        # green/red から独立して可視化する。run 33311769634 の upstream
        # 2 leg (falco-version 0.39.0 / 0.39.2) はまさにこの状態
        # (verdict=not_loaded かつ /tmp/falco_events.json 自体が存在しない、
        # 標準ルールセットはロードされていたにもかかわらず0件) で、
        # それでもジョブは green のまま完走していた。green である事実
        # だけを見ると検知が機能したかのように誤読されかねないため、
        # ここで明示的に ::warning:: を出す。これらのレグは観測目的
        # であり、ジョブを失敗させる設計ではないので exit 1 はしない。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          VERDICT_FILE="/tmp/falco_cicd_verdict.txt"
          EVENTS_FILE="/tmp/falco_events.json"
          LEG_LABEL="upstream / falco ${{ matrix.falco-version }}"

          VERDICT="unknown"
          if [ -f "$VERDICT_FILE" ]; then
            VERDICT="$(cat "$VERDICT_FILE")"
          fi

          EVENTS_HAVE_DATA="no"
          EVENTS_LINE_COUNT=0
          if [ -f "$EVENTS_FILE" ] && [ -s "$EVENTS_FILE" ]; then
            EVENTS_LINE_COUNT="$(wc -l < "$EVENTS_FILE" | tr -d ' ')"
            if [ "$EVENTS_LINE_COUNT" -gt 0 ]; then
              EVENTS_HAVE_DATA="yes"
            fi
          fi

          if [ "$VERDICT" != "loaded" ] && [ "$EVENTS_HAVE_DATA" = "no" ]; then
            MSG="leg ${LEG_LABEL}: CI/CD rules verdict=${VERDICT} and falco_events.json is absent/empty (line_count=${EVENTS_LINE_COUNT}). This leg produced NO detection data — a green check on this job does NOT mean detection worked here."
            echo "::warning::${MSG}"
            {
              echo ""
              echo "## このレグは検知データを生成しなかった (T-C, leg: ${LEG_LABEL})"
              echo ""
              echo "- CI/CD ルール判定 (verdict): \`${VERDICT}\`"
              echo "- falco_events.json: exists/line_count=${EVENTS_LINE_COUNT}"
              echo "- **このジョブが green であっても、このレグでは検知が機能した根拠は無い。**"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "## このレグの検知データ有無 (T-C, leg: ${LEG_LABEL})"
              echo ""
              echo "- CI/CD ルール判定 (verdict): \`${VERDICT}\`"
              echo "- falco_events.json: exists/line_count=${EVENTS_LINE_COUNT}"
              echo "- verdict=loaded またはイベントデータありのいずれかが成立しており、このレグは検知データを残している。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect telemetry (T2)
        if: always()
        run: |
          mkdir -p telemetry

          # 検知イベントの有無を明示する: /tmp/falco_events.json が
          # 「0件だった」のか「そもそもファイルが無かった」のかを区別できる
          # ようにする。job summary へのコピー (下) より前に summary へ
          # 追記しておくことで telemetry/job-summary.md にも反映させる。
          EVENTS_FILE="/tmp/falco_events.json"
          if [ -f "$EVENTS_FILE" ]; then
            EVENTS_SIZE="$(stat -c%s "$EVENTS_FILE" 2>/dev/null || stat -f%z "$EVENTS_FILE" 2>/dev/null || echo unknown)"
            EVENTS_LINES="$(wc -l < "$EVENTS_FILE" | tr -d ' ')"
          fi
          {
            echo ""
            echo "## falco_events.json (検知イベント)"
            echo ""
            if [ -f "$EVENTS_FILE" ]; then
              echo "- 存在する: exists=yes, size_bytes=${EVENTS_SIZE}, line_count=${EVENTS_LINES}"
            else
              echo "- 存在しない: exists=no (Falco が一度もイベントを書き出さなかった、"
              echo "  ファイル自体が無かった、または起動していなかった。0件検知とは区別すること)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" telemetry/job-summary.md
          fi
          # falco-actions の stop action (live mode) はこのファイルを
          # アーティファクトとしてアップロードしない。手元に残っていれば
          # 自分たちで回収する ("可能なら" 収集する、docs/SPEC.md §6)。
          if [ -f "$EVENTS_FILE" ]; then
            cp "$EVENTS_FILE" telemetry/falco_events.json
            {
              echo "exists: yes"
              echo "size_bytes: ${EVENTS_SIZE}"
              echo "line_count: ${EVENTS_LINES}"
            } > telemetry/falco_events_info.txt
          else
            echo "exists: no" > telemetry/falco_events_info.txt
          fi

          # docs/REQUIRED-FIXES.md R-3 は「対応済み」と記録されているが、実測
          # (run 33311769634, live-forked leg) では 8 件中 4 件がなおハーネス
          # 自身の $GITHUB_ENV / $GITHUB_STEP_SUMMARY 書き込み
          # (_runner_file_commands/ 配下) に対する "Source Code Overwrite" だった。
          # scenarios/lib/common.sh の testbed-log.jsonl をワークスペース外に
          # 退避させたことで 213/240 件の大半は消えたが、ハーネスが GitHub
          # Actions のランナー自身の仕組み ($GITHUB_ENV / $GITHUB_STEP_SUMMARY)
          # を経由して書き込むファイルまでは制御できない。ここではその残存
          # ノイズを黙って除外するのではなく、fd.name が
          # _runner_file_commands/ を含むかどうかで harness / scenario に
          # 分類し、両方をそのまま残す。ハーネスが検知されること自体も
          # ひとつの観測結果であり、それを消してしまう抑制 (suppression) は
          # 採らない。
          if [ -f "$EVENTS_FILE" ]; then
            cat > /tmp/classify_falco_events.py <<'PYEOF'
          import json
          import os

          EVENTS_FILE = os.environ.get("FALCO_EVENTS_FILE", "/tmp/falco_events.json")
          OUT_MD = "telemetry/falco_events_classified.md"
          OUT_JSON = "telemetry/falco_events_classified.json"
          SUMMARY_FILE = os.environ.get("GITHUB_STEP_SUMMARY")


          def classify(fd_name):
              return "harness" if "/_runner_file_commands/" in fd_name else "scenario"


          total = 0
          unparseable = 0
          rule_counts = {}
          fdname_counts = {}

          with open(EVENTS_FILE, encoding="utf-8") as f:
              for raw_line in f:
                  line = raw_line.strip()
                  if not line:
                      continue
                  total += 1
                  try:
                      ev = json.loads(line)
                  except Exception:
                      unparseable += 1
                      continue
                  output_fields = ev.get("output_fields")
                  fd_name = ""
                  if isinstance(output_fields, dict):
                      fd_name = output_fields.get("fd.name") or ""
                  rule = ev.get("rule", "(rule field missing)")
                  cls = classify(fd_name)
                  rule_counts[(rule, cls)] = rule_counts.get((rule, cls), 0) + 1
                  fdname_counts[(fd_name, cls)] = fdname_counts.get((fd_name, cls), 0) + 1

          scenario = sum(v for (_, c), v in rule_counts.items() if c == "scenario")
          harness = sum(v for (_, c), v in rule_counts.items() if c == "harness")

          lines = []
          lines.append(f"total={total}, scenario={scenario}, harness={harness}, unparseable={unparseable}")
          lines.append("")
          lines.append("| rule | classification | count |")
          lines.append("| --- | --- | --- |")
          for (rule, cls), cnt in sorted(rule_counts.items(), key=lambda kv: -kv[1]):
              lines.append(f"| {rule} | {cls} | {cnt} |")
          lines.append("")
          lines.append("| fd.name | classification | count |")
          lines.append("| --- | --- | --- |")
          for (fd, cls), cnt in sorted(fdname_counts.items(), key=lambda kv: -kv[1]):
              fd_display = fd if fd else "(fd.name missing)"
              lines.append(f"| {fd_display} | {cls} | {cnt} |")

          body = "\n".join(lines) + "\n"
          heading = "## falco_events.json の分類 (ハーネス自身のノイズ vs シナリオ起因)\n\n"

          print(heading + body)

          if SUMMARY_FILE:
              with open(SUMMARY_FILE, "a", encoding="utf-8") as f:
                  f.write("\n" + heading + body)

          os.makedirs("telemetry", exist_ok=True)
          with open(OUT_MD, "w", encoding="utf-8") as f:
              f.write("# falco_events.json classification\n\n")
              f.write(body)

          with open(OUT_JSON, "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "total": total,
                      "scenario": scenario,
                      "harness": harness,
                      "unparseable": unparseable,
                      "by_rule": [
                          {"rule": r, "classification": c, "count": n}
                          for (r, c), n in sorted(rule_counts.items(), key=lambda kv: -kv[1])
                      ],
                      "by_fd_name": [
                          {"fd_name": fd, "classification": c, "count": n}
                          for (fd, c), n in sorted(fdname_counts.items(), key=lambda kv: -kv[1])
                      ],
                  },
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")
          PYEOF
            python3 /tmp/classify_falco_events.py
          else
            {
              echo ""
              echo "## falco_events.json の分類 (ハーネス自身のノイズ vs シナリオ起因)"
              echo ""
              echo "\`${EVENTS_FILE}\` が存在しないため、分類をスキップした。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # required_engine_version 検証用 (T1 中核観測)。上の "Capture Falco
          # startup logs" ステップが生成する。
          if [ -f /tmp/falco_start_logs.txt ]; then
            cp /tmp/falco_start_logs.txt telemetry/falco_start_logs.txt
          fi
          # Stop Falco 直前のログ (シナリオ実行中に出たエラー等を捕捉するため、
          # "Capture Falco logs before stop" ステップが生成する)。
          if [ -f /tmp/falco_stop_logs.txt ]; then
            cp /tmp/falco_stop_logs.txt telemetry/falco_stop_logs.txt
          fi
          # "Stream Falco logs to file" ステップが docker logs -f で継続的に
          # 書き続けた生ログ。--rm でコンテナが消えても内容が残るため、
          # クラッシュ理由の手がかりとして最も確実な一次情報。
          if [ -f /tmp/falco_stream.log ]; then
            cp /tmp/falco_stream.log telemetry/falco_stream.log
          fi
          # 同ステップが docker events から記録した生ログ (die イベント /
          # exitCode の手がかり、取得できた場合)。
          if [ -f /tmp/falco_events_docker.log ]; then
            cp /tmp/falco_events_docker.log telemetry/falco_docker_events.log
          fi
          # scenarios/lib/common.sh が書く実行ログ。仕様必須ではないが、
          # 検知結果の突き合わせに有用なため追加で回収する。
          # パスは docs/REQUIRED-FIXES.md R-3 でワークスペース外
          # (/var/tmp/cicd-runtime-testbed) に移した。$RUNNER_TEMP 配下に
          # 書くと falco の "Source Code Overwrite" ルールが
          # ハーネス自身の書き込みで毎回発火してしまうため。
          testbed_log="${TESTBED_LOG:-/var/tmp/cicd-runtime-testbed/testbed-log.jsonl}"
          if [ -f "${testbed_log}" ]; then
            cp "${testbed_log}" telemetry/testbed-log.jsonl
          fi

      - name: Upload telemetry-falco-live-${{ matrix.falco-version }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-falco-live-${{ matrix.falco-version }}
          path: telemetry/
          if-no-files-found: warn
          # docs/REQUIRED-FIXES.md R-6: 従来は 1 日で、数日で全証跡が
          # 消えていた。ここに入るのは加工済みテレメトリのみで、
          # カナリアは全て偽値 (canaries/canaries.env, docs/SAFETY.md)
          # なので 7 日に延ばす。生の capture.scap の扱いは
          # falco-analyze.yml 側で別に制御しており、この変更の対象外。
          retention-days: 7

  live-forked:
    name: "live-forked / fork-fixed falco 0.44.1"
    runs-on: ubuntu-latest
    # このジョブは `live` ジョブと処理内容 (シナリオ実行・テレメトリ収集・
    # preflight) がほぼ重複するコピーである。可読性を優先してあえて重複を
    # 許容している。`live` との差分は次の4点のみ:
    #   1. falco-actions の参照先 (upstream の 558a3ce... ではなく fork の
    #      fix/cicd-rules-mount-path ブランチ = start/action.yaml:70 の
    #      マウントパスバグ修正版。検証用の一時的なブランチ参照であり、
    #      検証完了後は SHA pin に戻す。詳細はファイル冒頭のコメント参照)。
    #      このブランチでは使用イメージも falcosecurity/falco-no-driver から
    #      維持されている falcosecurity/falco に切り替わっている
    #   2. falco-version (matrix ではなく 0.44.1 固定の 1 leg。
    #      falcosecurity/falco の Docker Hub 上の実際の最新。ファイル冒頭の
    #      コメント参照)
    #   3. テレメトリアーティファクト名 (telemetry-falco-live-forked-0.44.1)
    #   4. preflight の対象イメージ (falcosecurity/falco-no-driver ではなく
    #      falcosecurity/falco の実タグを確認する)
    # `uses:` に式は使えないため、この leg を `live` ジョブの matrix に
    # 混ぜることはできず、別ジョブとして実装している (ファイル冒頭コメント参照)。
    permissions:
      contents: read
      # falco-actions の stop action (live モード) は、Falco イベントを
      # ジョブの各ステップに対応付けるため GitHub API (jobs) を呼ぶ。
      # README の注記: "actions: read permission is used to contact a
      # Github endpoint to perform a best-effort correlation".
      actions: read
    steps:
      - name: Checkout cicd-runtime-testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Preflight: falcosecurity/falco:0.44.1 タグの実在確認"
        # `live-forked` ジョブは fork 修正版 (fiord/falco-actions@fix/cicd-rules-mount-path)
        # を使っており、このブランチでは使用イメージが falcosecurity/falco-no-driver
        # (メンテナンス終了、0.39.2 で公開停止) ではなく、現在も更新が続いている
        # falco 本体イメージ `falcosecurity/falco` に切り替わっている。したがって
        # preflight の対象リポジトリも upstream leg (`live` ジョブ、
        # falcosecurity/falco-no-driver を検査) とは別に、falcosecurity/falco を
        # 検査する。存在しないタグを指定すると action の奥深くで
        # `docker: ... manifest unknown` と exit 125 になり原因がわかりにくいため、
        # ここで先に Docker Hub のタグ API を叩いて実在を確認し、無ければここで
        # 明確に落とす。ネットワーク障害や rate limit で preflight 自体が失敗した
        # 場合は、テストの可用性を落とさないよう警告のみで続行する。
        shell: bash
        env:
          FALCO_VERSION: "0.44.1"
        run: |
          set -uo pipefail
          API_URL="https://hub.docker.com/v2/repositories/falcosecurity/falco/tags?page_size=100&ordering=last_updated"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' --max-time 20 "$API_URL" 2>/dev/null)"
          CURL_EXIT=$?
          HTTP_CODE="${HTTP_CODE:-000}"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            echo "::warning title=falco tag preflight skipped::Docker Hub API (${API_URL}) への接続に失敗しました (curl exit=${CURL_EXIT}, HTTP ${HTTP_CODE})。ネットワーク障害または rate limit の可能性があるため、preflight をスキップしてワークフローを続行します。falco-version=${FALCO_VERSION} が実在しない場合、後続のステップが manifest not found で失敗する可能性があります。"
            {
              echo "### preflight: falcosecurity/falco:${FALCO_VERSION} (skipped)"
              echo ""
              echo "Docker Hub API への接続に失敗しました (curl exit=${CURL_EXIT}, HTTP ${HTTP_CODE})。"
              echo "ネットワーク障害または rate limit の可能性があるため、確認をスキップして続行しました。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$FALCO_VERSION" "$RESPONSE_FILE" "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import contextlib
          import json
          import re
          import sys

          falco_version, response_file, summary_file = sys.argv[1], sys.argv[2], sys.argv[3]

          # docs/REQUIRED-FIXES.md R-5: $GITHUB_STEP_SUMMARY は check-runs API
          # から取得できないため、判定内容を summary にしか書かないと、
          # アーティファクト失効後に結果を復元できない。summary への追記と
          # 同じ内容を stdout にも出し、ジョブログ側にも残す
          # (shell 側の `| tee -a "$GITHUB_STEP_SUMMARY"` と同じ意図)。
          @contextlib.contextmanager
          def open_summary(path):
              with open(path, "a", encoding="utf-8") as _f:
                  class _Tee:
                      @staticmethod
                      def write(text):
                          _f.write(text)
                          sys.stdout.write(text)
                  yield _Tee

          try:
              with open(response_file, encoding="utf-8") as f:
                  data = json.load(f)
              results = data.get("results", [])
              if not isinstance(results, list):
                  raise ValueError("results is not a list")
              tag_map = {t["name"]: t for t in results if isinstance(t, dict) and "name" in t}
          except Exception as e:
              msg = (
                  f"Docker Hub API のレスポンス解析に失敗しました ({e})。"
                  f"確認をスキップして続行します。"
              )
              print(f"::warning title=falco tag preflight skipped::{msg}")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco:{falco_version} (skipped)\n\n")
                  s.write(f"{msg}\n")
              sys.exit(0)

          semver_re = re.compile(r"^\d+\.\d+\.\d+$")
          numeric_tags = sorted(
              (name for name in tag_map if semver_re.match(name)),
              key=lambda v: [int(p) for p in v.split(".")],
          )

          if falco_version in tag_map:
              tag = tag_map[falco_version]
              last_pushed = tag.get("tag_last_pushed") or tag.get("last_updated") or "unknown"
              print(f"preflight OK: falcosecurity/falco:{falco_version} exists (tag_last_pushed={last_pushed})")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco:{falco_version}\n\n")
                  s.write(f"- Docker Hub にタグが実在することを確認しました。\n")
                  s.write(f"- 最終 push (`tag_last_pushed`): `{last_pushed}`\n\n")
              sys.exit(0)
          else:
              available = ", ".join(numeric_tags) if numeric_tags else "(取得できたページ内に数値タグが見つかりませんでした)"
              msg = (
                  f"falcosecurity/falco:{falco_version} は Docker Hub に存在しません "
                  f"(manifest unknown になります)。利用可能な数値タグ: {available}"
              )
              print(f"::error title=falco tag not found::{msg}")
              with open_summary(summary_file) as s:
                  s.write(f"### preflight: falcosecurity/falco:{falco_version} (NOT FOUND)\n\n")
                  s.write(f"- タグが存在しません。利用可能な数値タグ: {available}\n\n")
              sys.exit(1)
          PYEOF

      - name: Start Falco (live mode)
        id: start_falco
        # このジョブは falcosecurity/falco:0.44.1 (required_engine_version:
        # 0.43.0 を満たすエンジン) を使うため required_engine_version 由来の
        # 拒否は起きない見込みだが、代わりに「維持されているイメージの新しい
        # Falco が、現在のランナーのカーネル (6.17) で起動し続けられるか」
        # (検証したい3点の1点目、ファイル冒頭コメント参照) をこのステップと
        # 後続ステップで確認する。以前 falco-version を古いまま (0.39.2) にして
        # いたときは falcosecurity/falco:0.39.2 という古い Falco を pull して
        # しまい、`scap_init` に失敗し続けていた (run 32606439283)。起動失敗
        # そのものでジョブ全体を落とさないよう、ここでも continue-on-error に
        # しておく。後続ステップは falco が起動していなくても実行され、
        # 「起動し続けられなかった」という結果自体が観測データになる。
        continue-on-error: true
        # 検証用の一時的な例外 (docs/SPEC.md §8 / docs/SAFETY.md の「uses: は
        # 全てコミット SHA でピン留めする」方針に対する意図的な例外):
        # 参照先は自分 (fiord) が管理する fork のブランチであり、第三者の
        # リポジトリではない。fix/cicd-rules-mount-path ブランチに継続的に
        # 追加修正を入れている最中のため、SHA pin ではなくブランチ参照に
        # している。検証が完了したら必ずコミット SHA pin に戻すこと。
        # upstream (falcosecurity/falco-actions, 上の `live` ジョブ) 側の
        # 参照は SHA pin のまま変更しないこと。
        uses: fiord/falco-actions/start@fix/cicd-rules-mount-path # TEMPORARY EXCEPTION: fork-fixed branch ref (self-managed fork, actively iterating on start/action.yaml:70 cicd-rules mount-path fix); revert to SHA pin once stabilized
        with:
          mode: live
          falco-version: "0.44.1"
          verbose: true

      - name: "Stream Falco logs to file (survive --rm container disappearance)"
        # docker run --rm -d の Falco コンテナは異常終了すると即座に消え、消える
        # 直前の docker logs 出力 (クラッシュ理由を含む最後の行) ごと失われる。
        # これを防ぐため、Start Falco の直後に docker logs -f をバックグラウンドで
        # 起動し、出力を /tmp/falco_stream.log に追記し続ける。このファイルは
        # コンテナが消えても残るため、後続の起動完了ポーリングとテレメトリ収集は
        # (docker logs を都度叩くのではなく) このファイルを主たる情報源として使う。
        # あわせて docker events もバックグラウンドで記録し、--rm のため
        # docker inspect では取れない終了コードを die イベントから拾えないか試みる。
        # バックグラウンドプロセスの PID は GITHUB_ENV に記録し、後続の
        # "Stop background log/event capture processes" ステップで確実に
        # 終了させる。観測目的のステップなので失敗させない。
        id: stream_falco_logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STREAM_LOG="/tmp/falco_stream.log"
          EVENTS_LOG="/tmp/falco_events_docker.log"
          : > "$STREAM_LOG"
          : > "$EVENTS_LOG"

          if docker ps -a --filter "name=falco" 2>/dev/null | grep -q falco; then
            nohup docker logs -f falco > "$STREAM_LOG" 2>&1 &
            STREAM_PID=$!
            disown "$STREAM_PID" 2>/dev/null || true
            echo "FALCO_STREAM_PID=${STREAM_PID}" >> "$GITHUB_ENV"
            echo "[stream] started 'docker logs -f falco' (pid=${STREAM_PID}) -> ${STREAM_LOG}"
          else
            echo "(falco container not found when starting log stream; Start Falco step likely failed)" >> "$STREAM_LOG"
            echo "[stream] falco container not found; nothing to stream."
          fi

          SINCE_TS=$(( $(date -u +%s) - 60 ))
          nohup docker events --filter "container=falco" --since "${SINCE_TS}" > "$EVENTS_LOG" 2>&1 &
          EVENTS_PID=$!
          disown "$EVENTS_PID" 2>/dev/null || true
          echo "FALCO_DOCKER_EVENTS_PID=${EVENTS_PID}" >> "$GITHUB_ENV"
          echo "[events] started 'docker events' recorder (pid=${EVENTS_PID}) -> ${EVENTS_LOG}"
          exit 0

      - name: "Capture Falco startup logs (required_engine_version check, T1)"
        # falco-actions 同梱の CI/CD ルール (rules/falco_cicd_rules.yaml) は
        # `required_engine_version: 0.43.0` を宣言している。この leg
        # (fork-fixed) は falcosecurity/falco:0.44.1 (required_engine_version:
        # 0.43.0 を満たすエンジン。ファイル冒頭のコメント参照) を使うため、
        # upstream leg (`live` ジョブ、falco-no-driver 上限の 0.39.x で
        # required_engine_version との不整合を見る) とは異なり、ここでの
        # 主眼は required_engine_version ではなく「維持されているイメージの
        # 新しい Falco が、現在のランナーのカーネル (6.17) で起動し続けられる
        # か」(検証したい3点の1点目) にある。falco コンテナ起動直後のログから
        # required_engine_version / engine version 関連の記述の有無、および
        # 起動完了マーカーの有無を拾い、job summary と telemetry に残す
        # (docs/RESULTS-TEMPLATE.md T1 の記入欄に対応)。
        #
        # ポーリングは docker logs を都度叩くのではなく /tmp/falco_stream.log
        # (直前のステップが docker logs -f で継続的に書き続けているファイル) の
        # 内容に対して行なう。コンテナが --rm で消えてもファイルは残るため、
        # クラッシュ直前の最後の出力まで確実に拾える。ポーリング間隔は 0.2秒
        # (旧: 1秒) に短縮し、取りこぼしを減らす。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG_FILE="/tmp/falco_start_logs.txt"
          MARKER_STATUS_FILE="/tmp/falco_startup_marker_status.txt"
          STREAM_LOG="/tmp/falco_stream.log"
          EVENTS_LOG="/tmp/falco_events_docker.log"
          STARTUP_TIMEOUT=60
          POLL_INTERVAL=0.2
          MARKER_REGEX="Enabled event sources|Opening 'syscall' source"

          {
            echo "# falco startup log capture (engine requirement check, falco-version=0.44.1, fork-fixed)"
            echo "# primary source: ${STREAM_LOG} (docker logs -f, streamed continuously since"
            echo "# right after Start Falco; content survives the --rm container disappearing)"
            echo ""
          } > "$LOG_FILE"

          STARTUP_MARKER_FOUND="no"
          CONTAINER_NEVER_STARTED="no"
          ITERS=0
          MAX_ITERS=$(awk -v t="$STARTUP_TIMEOUT" -v p="$POLL_INTERVAL" 'BEGIN{printf "%d", (t/p)+0.5}')

          if [ -f "$STREAM_LOG" ] && grep -q "falco container not found when starting log stream" "$STREAM_LOG" 2>/dev/null; then
            CONTAINER_NEVER_STARTED="yes"
          elif [ ! -f "$STREAM_LOG" ]; then
            echo "(warning: ${STREAM_LOG} not found; 'Stream Falco logs to file' step may not have run)" >> "$LOG_FILE"
          fi

          if [ "$CONTAINER_NEVER_STARTED" = "no" ] && [ -f "$STREAM_LOG" ]; then
            # 起動完了 (Falco がイベントソースを開き終える) を示すマーカーが
            # ストリームファイルに現れるまでポーリングする。
            while [ "$ITERS" -lt "$MAX_ITERS" ]; do
              if grep -qE "$MARKER_REGEX" "$STREAM_LOG" 2>/dev/null; then
                STARTUP_MARKER_FOUND="yes"
                break
              fi
              ITERS=$((ITERS + 1))
              sleep "$POLL_INTERVAL"
            done
          fi

          ELAPSED="$(awk -v i="$ITERS" -v p="$POLL_INTERVAL" 'BEGIN{printf "%.1f", i*p}')"
          DOCKER_PS_OUTPUT="$(docker ps -a --filter "name=falco" 2>&1 || true)"
          CONTAINER_ALIVE="no"
          if printf '%s' "$DOCKER_PS_OUTPUT" | grep -q falco; then
            CONTAINER_ALIVE="yes"
          fi

          {
            echo "## docker ps -a --filter name=falco (container status, checked after polling)"
            echo '```'
            echo "$DOCKER_PS_OUTPUT"
            echo '```'
            echo ""
            echo "## ${STREAM_LOG} (full content)"
            echo '```'
            if [ -f "$STREAM_LOG" ]; then
              cat "$STREAM_LOG"
            else
              echo "(not found)"
            fi
            echo '```'
            echo ""
            if [ "$CONTAINER_NEVER_STARTED" = "yes" ]; then
              echo "(falco container not found; Start Falco step likely failed — see its outcome)"
            elif [ "$STARTUP_MARKER_FOUND" = "yes" ]; then
              echo "[poll] startup completion marker detected after ~${ELAPSED}s (matched: ${MARKER_REGEX})."
            elif [ "$CONTAINER_ALIVE" = "yes" ]; then
              echo "[poll] startup completion marker NOT observed within ${STARTUP_TIMEOUT}s timeout; container is still present. Rule-loading outcome could not be confirmed from this log alone; captured logs may be incomplete."
            else
              echo "[poll] falco container is gone (docker run --rm; likely crashed). The stream log above was captured via 'docker logs -f' running continuously in the background since right after Start Falco, so it should contain everything Falco printed up to the moment it died — unlike a single docker logs snapshot, which would have been lost together with the container."
            fi
          } >> "$LOG_FILE"

          if [ "$CONTAINER_NEVER_STARTED" = "yes" ]; then
            HAS_ENGINE_MENTION="n/a"
            STARTUP_MARKER_FOUND="n/a"
          elif grep -qiE "required_engine_version|engine version|rules requiring" "$LOG_FILE"; then
            HAS_ENGINE_MENTION="yes"
          else
            HAS_ENGINE_MENTION="no"
          fi

          # docker events の die イベントから終了コードを拾えないか試みる
          # (--rm のため docker inspect では取得できない)。実機の Docker は
          # デフォルトのテキスト出力に `exitCode=N` を含むため、まずそれを
          # 探す。取れなければ (podman 環境など) JSON 系フォーマットで使われる
          # ContainerExitCode / exitCode キーも探す。どちらも見つからなくても
          # 失敗させない。
          EXIT_CODE_INFO="not captured"
          DIE_LINE=""
          if [ -f "$EVENTS_LOG" ] && [ -s "$EVENTS_LOG" ]; then
            DIE_LINE="$(grep -iE 'die' "$EVENTS_LOG" | grep -F 'falco' | tail -1 || true)"
            if [ -n "$DIE_LINE" ]; then
              EXIT_CODE="$(printf '%s' "$DIE_LINE" | grep -oE 'exitCode=[0-9]+' | head -1 || true)"
              if [ -z "$EXIT_CODE" ]; then
                RAW_CODE="$(printf '%s' "$DIE_LINE" | grep -oE '"?[Cc]ontainerExitCode"?[:= ]+"?[0-9]+"?' | grep -oE '[0-9]+' | tail -1 || true)"
                if [ -n "$RAW_CODE" ]; then
                  EXIT_CODE="ContainerExitCode=${RAW_CODE}"
                fi
              fi
              if [ -n "$EXIT_CODE" ]; then
                EXIT_CODE_INFO="${EXIT_CODE} (from docker events)"
              else
                EXIT_CODE_INFO="die event observed but no exit-code attribute could be parsed"
              fi
            fi
          fi

          {
            echo ""
            echo "## falco コンテナの終了コード (docker events, best-effort — --rm のため docker inspect 不可)"
            echo ""
            echo "- 終了コード: **${EXIT_CODE_INFO}**"
            if [ -n "$DIE_LINE" ]; then
              echo "  該当イベント行:"
              echo '  ```'
              echo "  ${DIE_LINE}"
              echo '  ```'
            fi
            if [ -f "$EVENTS_LOG" ] && [ -s "$EVENTS_LOG" ]; then
              echo "  ${EVENTS_LOG} の全内容:"
              echo '  ```'
              sed 's/^/  /' "$EVENTS_LOG"
              echo '  ```'
            else
              echo "  (${EVENTS_LOG} は空、または作成されなかった)"
            fi
          } >> "$LOG_FILE"

          printf '%s' "$STARTUP_MARKER_FOUND" > "$MARKER_STATUS_FILE"

          {
            echo ""
            echo "## required_engine_version 0.43.0 vs falco 0.44.1 (fork-fixed, T1 中核観測)"
            echo ""
            echo "falco-actions 同梱の CI/CD ルール (rules/falco_cicd_rules.yaml) は"
            echo "\`required_engine_version: 0.43.0\` を宣言している。upstream leg"
            echo "(\`live\` ジョブ) は falco-no-driver の公開停止により \`0.39.2\` が上限"
            echo "だが、この fork-fixed leg は維持されている falcosecurity/falco"
            echo "イメージ (\`0.44.1\`) を使うため required_engine_version を満たす。"
            echo "したがってここでの主眼は required_engine_version 由来の拒否/警告の"
            echo "有無ではなく、この新しいエンジンが現在のランナーのカーネル (6.17) で"
            echo "起動し続けられるか (検証したい3点の1点目) にある。"
            echo ""
            case "$HAS_ENGINE_MENTION" in
              yes)
                echo "- \`docker logs falco\` に required_engine_version / engine version への言及**あり**。"
                echo "  ルールがロード拒否または警告付きで扱われた可能性が高い。抜粋:"
                echo '  ```'
                grep -iE "required_engine_version|engine version|rules requiring" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              no)
                echo "- \`docker logs falco\` に required_engine_version / engine version への言及は"
                echo "  見つからなかった。警告なしでロードされたか、そもそもログに出ない形で"
                echo "  無視されたかは、このログだけでは切り分けられない。"
                echo "  telemetry の \`falco_start_logs.txt\` の全文と \`falco_events.json\`"
                echo "  (cicd_rules 由来のイベントが実際に発火しているか) を突き合わせて判断すること。"
                ;;
              *)
                echo "- falco コンテナが見つからなかった。Start Falco 自体が失敗したため、"
                echo "  ルールロードの成否そのものを確認できない。"
                ;;
            esac
            echo ""
            echo "## falco コンテナの終了コード (docker events, best-effort)"
            echo "- **${EXIT_CODE_INFO}**"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Assert (observational): CI/CD rules loaded?"
        # falcosecurity/falco-actions の start/action.yaml:70 の既知のバグ
        # (github.action_path の解決先が action.yaml のあるディレクトリ (start/)
        # を指すため、リポジトリ直下 rules/ への相対パスがずれ、存在しない
        # マウント元パスが Docker によって暗黙に空ディレクトリへ置き換わり、
        # CI/CD ルールファイルが一度もロードされない) を、起動ログから実地確認する。
        # このジョブは fork-fixed 版 (fiord/falco-actions@fix/cicd-rules-mount-path,
        # 検証用の一時的なブランチ参照) を使うため、
        # 期待される判定は「ロードされた形跡あり」。判定は「/tmp/falco_start_logs.txt
        # (直前のステップが生成) に cicd_rules.yaml または rules.d への言及が
        # 現れるか」で行なう。観測が目的のステップなので、期待に反する結果が出ても
        # ジョブを失敗させない (結果を job summary に記録するだけ)。upstream leg
        # (live ジョブ) と同じ判定ロジックを使い、job summary を並べて見比べられる
        # ようにしている。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG_FILE="/tmp/falco_start_logs.txt"
          MARKER_STATUS_FILE="/tmp/falco_startup_marker_status.txt"
          ERROR_REGEX="required_engine_version|engine version|Runtime error|Invalid|cannot be loaded"

          CICD_LOADED="unknown"
          if [ -f "$LOG_FILE" ]; then
            if grep -qiE "cicd_rules\.yaml" "$LOG_FILE"; then
              CICD_LOADED="yes"
            elif grep -qiE "rules\.d" "$LOG_FILE"; then
              CICD_LOADED="maybe"
            else
              CICD_LOADED="no"
            fi
          else
            CICD_LOADED="n/a"
          fi

          ERROR_FOUND="no"
          if [ -f "$LOG_FILE" ] && grep -qiE "$ERROR_REGEX" "$LOG_FILE"; then
            ERROR_FOUND="yes"
          fi

          # 標準ルールセット (/etc/falco/falco_rules.yaml) がロードされたか
          # (docs/REQUIRED-FIXES.md R-4 / docs/TEST-PLAN.md「公平性:
          # ルールセットの母数」)。
          #
          # なぜ観測するのか: R-4 の監査本文は「live モードでは
          # cicd_rules.yaml しかロードしていない」としているが、falco の
          # 既定 falco.yaml の rules_files: は /etc/falco/falco_rules.yaml /
          # falco_rules.local.yaml / rules.d を含むため、標準ルールも
          # ロードされている**はず**である。falco 側の検知件数が
          # 1 種類しか出ない理由が「標準ルールが無いから」なのか
          # 「標準ルールはあるがこれらのシナリオに反応しないから」なのかで
          # 結論がまったく変わるので、推測せず実測で確定させる。
          #
          # これは falco の構成を変える変更ではなく、何がロードされたかを
          # 記録するだけの観測である (両ツールとも出荷時構成のまま測る、
          # という方針を崩さない)。
          #
          # 注意: パターン `falco_rules\.yaml` は `falco_cicd_rules.yaml`
          # には一致しない (後者は "cicd_rules.yaml" で終わる) ので、
          # 上の CICD_LOADED 判定と混同しない。
          STD_RULES="unknown"
          if [ -f "$LOG_FILE" ]; then
            if grep -qiE "falco_rules\.yaml" "$LOG_FILE"; then
              STD_RULES="yes"
            else
              STD_RULES="no_mention"
            fi
          else
            STD_RULES="n/a"
          fi

          STARTUP_MARKER="unknown"
          if [ -f "$MARKER_STATUS_FILE" ]; then
            STARTUP_MARKER="$(cat "$MARKER_STATUS_FILE")"
          fi

          # 3値判定: loaded / rejected (エラー語あり) / not_loaded (言及もエラーも無し)
          if [ "$ERROR_FOUND" = "yes" ]; then
            VERDICT="rejected"
          elif [ "$CICD_LOADED" = "yes" ] || [ "$CICD_LOADED" = "maybe" ]; then
            VERDICT="loaded"
          else
            VERDICT="not_loaded"
          fi

          # T-C: 後続の "Record leg detection-data outcome" ステップは別
          # ステップ (別シェル) なので、ここで確定した VERDICT をファイルに
          # 残しておかないと参照できない。既存の
          # /tmp/falco_startup_marker_status.txt と同じやり方に合わせる。
          printf '%s' "$VERDICT" > /tmp/falco_cicd_verdict.txt

          {
            echo ""
            echo "## CI/CD ルールはロードされたか (job: ${{ github.job }}, leg: fork-fixed / falco 0.44.1)"
            echo ""
            echo "action 参照先: \`fiord/falco-actions/start@fix/cicd-rules-mount-path\` (branch, 検証用の一時的な例外)"
            echo "(fork-fixed。start/action.yaml:70 のマウントパスバグ修正版。修正の起点:"
            echo "https://github.com/fiord/falco-actions/commit/360d62c72985b790bff96abde043b14ae053efe5)。"
            echo ""
            case "$CICD_LOADED" in
              yes)
                echo "- \`cicd_rules.yaml\` への言及: **あり**。該当行:"
                echo '  ```'
                grep -iE "cicd_rules\.yaml" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              maybe)
                echo "- \`cicd_rules.yaml\` への直接の言及は無いが \`rules.d\` への言及はあった"
                echo "  (不明)。該当行:"
                echo '  ```'
                grep -iE "rules\.d" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              no)
                echo "- \`cicd_rules.yaml\` / \`rules.d\` への言及は起動ログに一切見つからなかった。"
                echo "  fork-fixed leg なのにロードされていない場合、修正が効いていない、"
                echo "  または別の問題がある可能性が高いため要調査。"
                ;;
              *)
                echo "- 起動ログ (\`falco_start_logs.txt\`) が見つからず判定不能"
                echo "  (Start Falco 自体が失敗した可能性が高い)。"
                ;;
            esac
            echo ""
            echo "- エラー語 (\`required_engine_version\` / \`engine version\` / \`Runtime error\` /"
            echo "  \`Invalid\` / \`cannot be loaded\`) の有無: **${ERROR_FOUND}**"
            if [ "$ERROR_FOUND" = "yes" ]; then
              echo "  該当行:"
              echo '  ```'
              grep -iE "$ERROR_REGEX" "$LOG_FILE" | sed 's/^/  /' | head -20
              echo '  ```'
            fi
            echo ""
            echo "- 標準ルールセット (\`/etc/falco/falco_rules.yaml\`) への言及: **${STD_RULES}**"
            case "$STD_RULES" in
              yes)
                echo "  (falco 既定の \`rules_files:\` どおり標準ルールもロードされている。"
                echo "  したがって falco 側の発火種類数の少なさは「ルールが無いから」ではなく"
                echo "  「標準ルールがこれらのシナリオに反応しないから」である。該当行:)"
                echo '  ```'
                grep -iE "falco_rules\.yaml" "$LOG_FILE" | sed 's/^/  /' | head -20
                echo '  ```'
                ;;
              no_mention)
                echo "  (起動ログに言及が無い。falco が読み込んだルールファイルを"
                echo "  逐一ログ出力しないバージョンの可能性もあるため、"
                echo "  **「ロードされていない」と断定はできない**。)"
                ;;
              *)
                echo "  (起動ログが無く判定不能。)"
                ;;
            esac
            echo ""
            echo "  → この観測は docs/TEST-PLAN.md「公平性: ルールセットの母数が違うため"
            echo "  検知件数は直接比較できない (R-4)」の根拠として使うこと。"
            echo ""
            echo "- 起動完了マーカー (\`Enabled event sources\` / \`Opening 'syscall' source\`) 検出: **${STARTUP_MARKER}**"
            case "$STARTUP_MARKER" in
              yes) echo "  (Falco は正常に起動しきったと判断できる)" ;;
              no) echo "  (60秒待っても現れなかった。起動が完了しなかったか、非常に遅延している可能性がある)" ;;
              n/a) echo "  (falco コンテナ自体が見つからなかった)" ;;
              *) echo "  (状態不明)" ;;
            esac
            echo ""
            echo "- **総合判定: \`${VERDICT}\`** (\`loaded\` / \`rejected\` / \`not_loaded\` の3値)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run detection scenarios
        shell: bash
        env:
          # docs/SPEC.md §3: CANARY_ENV のみ GitHub Secrets 経由。
          # Secret 未設定でも scenarios/lib/common.sh の load_canaries が
          # フォールバックしてくれる (README 参照)。
          CANARY_ENV: ${{ secrets.CANARY_ENV }}
        run: |
          set -uo pipefail
          echo "::group::00-seed"
          bash scenarios/00-seed.sh
          echo "::endgroup::"

          echo "::group::01-credential-access"
          bash scenarios/01-credential-access.sh
          echo "::endgroup::"

          echo "::group::02-exfil"
          bash scenarios/02-exfil.sh
          echo "::endgroup::"

          echo "::group::03-npm-postinstall"
          npm install --no-audit --no-fund ./scenarios/03-npm-postinstall || true
          echo "::endgroup::"

          echo "::group::04-persistence"
          bash scenarios/04-persistence.sh
          echo "::endgroup::"

          echo "::group::05-memfd-exec"
          bash scenarios/05-memfd-exec.sh
          echo "::endgroup::"

          echo "::group::06-anti-forensics"
          bash scenarios/06-anti-forensics.sh
          echo "::endgroup::"

      - name: "Drain window before stopping Falco"
        # 実測 (run 33311769634, live-forked leg) では "Run detection
        # scenarios" ステップの所要時間がわずか 1 秒で、直後の
        # "Capture Falco logs before stop (T1)" ステップが同じ秒に開始して
        # いた。つまりシナリオ実行の終了から Falco を止めるまでの間に
        # 一切の待ち時間が無かった。Falco の file_output はバッファリング
        # されることがあり、eBPF 経由のイベント処理にも遅延がありうるため、
        # この状態のままでは「0 件検知」という結果がシナリオを本当に
        # 見逃したのか、単に Falco がイベントを書き出す前に停止されて
        # しまっただけなのかを切り分けられない。ここで数秒待ってから
        # 停止することで、"0 件検知" という観測結果に意味を持たせる
        # (drain 不足による見かけ上のゼロと、本当の未検知を混同しない
        # ようにする)。
        if: always()
        shell: bash
        run: |
          echo "waiting 5s for Falco's buffered file_output / eBPF event processing to catch up with the scenarios that just ran, before Falco is stopped (run 33311769634: scenarios finished and Falco was stopped in the same second, with zero drain time)"
          sleep 5

      - name: "Capture Falco logs before stop (T1)"
        # Stop Falco の直前にもう一度 docker logs を取得する。起動直後には
        # まだ現れないエラー (ルール評価時のエラーなど、シナリオ実行中に発生
        # したもの) を捕捉するため。falco_start_logs.txt とは別ファイルに保存し、
        # 起動完了マーカー捕捉後にのみ発生し得る事象と比較できるようにする。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG_FILE="/tmp/falco_stop_logs.txt"
          {
            echo "# falco logs immediately before Stop Falco (falco-version=0.44.1, fork-fixed)"
            echo ""
          } > "$LOG_FILE"

          if docker ps -a --filter "name=falco" | grep -q falco; then
            if ! docker logs falco >> "$LOG_FILE" 2>&1; then
              echo "" >> "$LOG_FILE"
              echo "(docker logs falco failed just now; container may have disappeared between the check above and this call)" >> "$LOG_FILE"
            fi
          else
            echo "(falco container not found; it may have already been removed — e.g. docker run --rm after a crash — or Start Falco never succeeded)" >> "$LOG_FILE"
          fi

      - name: "Stop background log/event capture processes"
        # "Stream Falco logs to file" ステップで起動した docker logs -f /
        # docker events のバックグラウンドプロセスを、GITHUB_ENV に記録して
        # おいた PID を使って確実に終了させる。既に終了している場合や PID が
        # 記録されていない場合でも失敗させない。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -n "${FALCO_STREAM_PID:-}" ]; then
            kill "${FALCO_STREAM_PID}" 2>/dev/null || true
            echo "stopped docker logs -f stream (pid=${FALCO_STREAM_PID})"
          else
            echo "(FALCO_STREAM_PID not set; nothing to stop)"
          fi
          if [ -n "${FALCO_DOCKER_EVENTS_PID:-}" ]; then
            kill "${FALCO_DOCKER_EVENTS_PID}" 2>/dev/null || true
            echo "stopped docker events recorder (pid=${FALCO_DOCKER_EVENTS_PID})"
          else
            echo "(FALCO_DOCKER_EVENTS_PID not set; nothing to stop)"
          fi
          exit 0

      - name: Stop Falco (live mode) and build job summary
        if: always()
        # 検証用の一時的な例外 (docs/SPEC.md §8 / docs/SAFETY.md の「uses: は
        # 全てコミット SHA でピン留めする」方針に対する意図的な例外):
        # 参照先は自分 (fiord) が管理する fork のブランチであり、第三者の
        # リポジトリではない。fix/cicd-rules-mount-path ブランチに継続的に
        # 追加修正を入れている最中のため、SHA pin ではなくブランチ参照に
        # している (Start Falco ステップと同じ理由)。検証が完了したら必ず
        # コミット SHA pin に戻すこと。upstream (falcosecurity/falco-actions,
        # 上の `live` ジョブ) 側の参照は SHA pin のまま変更しないこと。
        uses: fiord/falco-actions/stop@fix/cicd-rules-mount-path # TEMPORARY EXCEPTION: fork-fixed branch ref (self-managed fork, same as start above); revert to SHA pin once stabilized
        with:
          mode: live
          verbose: true

      - name: Record engine-version matrix outcome in job summary
        if: always()
        run: |
          {
            echo ""
            echo "## falco-live matrix note"
            echo "- \`falco-version\`: \`0.44.1\`"
            echo "- action source: fork-fixed fiord/falco-actions@fix/cicd-rules-mount-path (branch ref, temporary verification exception; uses the maintained falcosecurity/falco image, not falco-no-driver)"
            echo "- required_engine_version of the bundled CI/CD rules: \`0.43.0\`"
            echo "- falcosecurity/falco の実際の最新 (Docker Hub, 2026-06-11 push): \`0.44.1\`"
            echo "- \`Start Falco\` step outcome: \`${{ steps.start_falco.outcome }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Record leg detection-data outcome"
        # T-C: "Assert (observational): CI/CD rules loaded?" の3値判定
        # (loaded / rejected / not_loaded、/tmp/falco_cicd_verdict.txt に
        # 保存済み) と、falco_events.json の有無・行数を突き合わせ、
        # 「このレグは検知データを一切生成しなかった」ことを job 全体の
        # green/red から独立して可視化する。この live-forked leg は
        # run 33311769634 で verdict=loaded かつ8件検知だったため通常は
        # 該当しないが、将来 fork 側の修正が壊れて not_loaded に戻った
        # 場合に同じ理由で見逃されないよう、upstream (live ジョブ) と
        # 同じチェックをここにも入れておく。これらのレグは観測目的で
        # あり、ジョブを失敗させる設計ではないので exit 1 はしない。
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          VERDICT_FILE="/tmp/falco_cicd_verdict.txt"
          EVENTS_FILE="/tmp/falco_events.json"
          LEG_LABEL="fork-fixed / falco 0.44.1"

          VERDICT="unknown"
          if [ -f "$VERDICT_FILE" ]; then
            VERDICT="$(cat "$VERDICT_FILE")"
          fi

          EVENTS_HAVE_DATA="no"
          EVENTS_LINE_COUNT=0
          if [ -f "$EVENTS_FILE" ] && [ -s "$EVENTS_FILE" ]; then
            EVENTS_LINE_COUNT="$(wc -l < "$EVENTS_FILE" | tr -d ' ')"
            if [ "$EVENTS_LINE_COUNT" -gt 0 ]; then
              EVENTS_HAVE_DATA="yes"
            fi
          fi

          if [ "$VERDICT" != "loaded" ] && [ "$EVENTS_HAVE_DATA" = "no" ]; then
            MSG="leg ${LEG_LABEL}: CI/CD rules verdict=${VERDICT} and falco_events.json is absent/empty (line_count=${EVENTS_LINE_COUNT}). This leg produced NO detection data — a green check on this job does NOT mean detection worked here."
            echo "::warning::${MSG}"
            {
              echo ""
              echo "## このレグは検知データを生成しなかった (T-C, leg: ${LEG_LABEL})"
              echo ""
              echo "- CI/CD ルール判定 (verdict): \`${VERDICT}\`"
              echo "- falco_events.json: exists/line_count=${EVENTS_LINE_COUNT}"
              echo "- **このジョブが green であっても、このレグでは検知が機能した根拠は無い。**"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "## このレグの検知データ有無 (T-C, leg: ${LEG_LABEL})"
              echo ""
              echo "- CI/CD ルール判定 (verdict): \`${VERDICT}\`"
              echo "- falco_events.json: exists/line_count=${EVENTS_LINE_COUNT}"
              echo "- verdict=loaded またはイベントデータありのいずれかが成立しており、このレグは検知データを残している。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect telemetry (T2)
        if: always()
        run: |
          mkdir -p telemetry

          # 検知イベントの有無を明示する: /tmp/falco_events.json が
          # 「0件だった」のか「そもそもファイルが無かった」のかを区別できる
          # ようにする。job summary へのコピー (下) より前に summary へ
          # 追記しておくことで telemetry/job-summary.md にも反映させる。
          EVENTS_FILE="/tmp/falco_events.json"
          if [ -f "$EVENTS_FILE" ]; then
            EVENTS_SIZE="$(stat -c%s "$EVENTS_FILE" 2>/dev/null || stat -f%z "$EVENTS_FILE" 2>/dev/null || echo unknown)"
            EVENTS_LINES="$(wc -l < "$EVENTS_FILE" | tr -d ' ')"
          fi
          {
            echo ""
            echo "## falco_events.json (検知イベント)"
            echo ""
            if [ -f "$EVENTS_FILE" ]; then
              echo "- 存在する: exists=yes, size_bytes=${EVENTS_SIZE}, line_count=${EVENTS_LINES}"
            else
              echo "- 存在しない: exists=no (Falco が一度もイベントを書き出さなかった、"
              echo "  ファイル自体が無かった、または起動していなかった。0件検知とは区別すること)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" telemetry/job-summary.md
          fi
          # falco-actions の stop action (live mode) はこのファイルを
          # アーティファクトとしてアップロードしない。手元に残っていれば
          # 自分たちで回収する ("可能なら" 収集する、docs/SPEC.md §6)。
          if [ -f "$EVENTS_FILE" ]; then
            cp "$EVENTS_FILE" telemetry/falco_events.json
            {
              echo "exists: yes"
              echo "size_bytes: ${EVENTS_SIZE}"
              echo "line_count: ${EVENTS_LINES}"
            } > telemetry/falco_events_info.txt
          else
            echo "exists: no" > telemetry/falco_events_info.txt
          fi

          # docs/REQUIRED-FIXES.md R-3 は「対応済み」と記録されているが、実測
          # (run 33311769634, live-forked leg) では 8 件中 4 件がなおハーネス
          # 自身の $GITHUB_ENV / $GITHUB_STEP_SUMMARY 書き込み
          # (_runner_file_commands/ 配下) に対する "Source Code Overwrite" だった。
          # scenarios/lib/common.sh の testbed-log.jsonl をワークスペース外に
          # 退避させたことで 213/240 件の大半は消えたが、ハーネスが GitHub
          # Actions のランナー自身の仕組み ($GITHUB_ENV / $GITHUB_STEP_SUMMARY)
          # を経由して書き込むファイルまでは制御できない。ここではその残存
          # ノイズを黙って除外するのではなく、fd.name が
          # _runner_file_commands/ を含むかどうかで harness / scenario に
          # 分類し、両方をそのまま残す。ハーネスが検知されること自体も
          # ひとつの観測結果であり、それを消してしまう抑制 (suppression) は
          # 採らない。
          if [ -f "$EVENTS_FILE" ]; then
            cat > /tmp/classify_falco_events.py <<'PYEOF'
          import json
          import os

          EVENTS_FILE = os.environ.get("FALCO_EVENTS_FILE", "/tmp/falco_events.json")
          OUT_MD = "telemetry/falco_events_classified.md"
          OUT_JSON = "telemetry/falco_events_classified.json"
          SUMMARY_FILE = os.environ.get("GITHUB_STEP_SUMMARY")


          def classify(fd_name):
              return "harness" if "/_runner_file_commands/" in fd_name else "scenario"


          total = 0
          unparseable = 0
          rule_counts = {}
          fdname_counts = {}

          with open(EVENTS_FILE, encoding="utf-8") as f:
              for raw_line in f:
                  line = raw_line.strip()
                  if not line:
                      continue
                  total += 1
                  try:
                      ev = json.loads(line)
                  except Exception:
                      unparseable += 1
                      continue
                  output_fields = ev.get("output_fields")
                  fd_name = ""
                  if isinstance(output_fields, dict):
                      fd_name = output_fields.get("fd.name") or ""
                  rule = ev.get("rule", "(rule field missing)")
                  cls = classify(fd_name)
                  rule_counts[(rule, cls)] = rule_counts.get((rule, cls), 0) + 1
                  fdname_counts[(fd_name, cls)] = fdname_counts.get((fd_name, cls), 0) + 1

          scenario = sum(v for (_, c), v in rule_counts.items() if c == "scenario")
          harness = sum(v for (_, c), v in rule_counts.items() if c == "harness")

          lines = []
          lines.append(f"total={total}, scenario={scenario}, harness={harness}, unparseable={unparseable}")
          lines.append("")
          lines.append("| rule | classification | count |")
          lines.append("| --- | --- | --- |")
          for (rule, cls), cnt in sorted(rule_counts.items(), key=lambda kv: -kv[1]):
              lines.append(f"| {rule} | {cls} | {cnt} |")
          lines.append("")
          lines.append("| fd.name | classification | count |")
          lines.append("| --- | --- | --- |")
          for (fd, cls), cnt in sorted(fdname_counts.items(), key=lambda kv: -kv[1]):
              fd_display = fd if fd else "(fd.name missing)"
              lines.append(f"| {fd_display} | {cls} | {cnt} |")

          body = "\n".join(lines) + "\n"
          heading = "## falco_events.json の分類 (ハーネス自身のノイズ vs シナリオ起因)\n\n"

          print(heading + body)

          if SUMMARY_FILE:
              with open(SUMMARY_FILE, "a", encoding="utf-8") as f:
                  f.write("\n" + heading + body)

          os.makedirs("telemetry", exist_ok=True)
          with open(OUT_MD, "w", encoding="utf-8") as f:
              f.write("# falco_events.json classification\n\n")
              f.write(body)

          with open(OUT_JSON, "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "total": total,
                      "scenario": scenario,
                      "harness": harness,
                      "unparseable": unparseable,
                      "by_rule": [
                          {"rule": r, "classification": c, "count": n}
                          for (r, c), n in sorted(rule_counts.items(), key=lambda kv: -kv[1])
                      ],
                      "by_fd_name": [
                          {"fd_name": fd, "classification": c, "count": n}
                          for (fd, c), n in sorted(fdname_counts.items(), key=lambda kv: -kv[1])
                      ],
                  },
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")
          PYEOF
            python3 /tmp/classify_falco_events.py
          else
            {
              echo ""
              echo "## falco_events.json の分類 (ハーネス自身のノイズ vs シナリオ起因)"
              echo ""
              echo "\`${EVENTS_FILE}\` が存在しないため、分類をスキップした。"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # required_engine_version 検証用 (T1 中核観測)。上の "Capture Falco
          # startup logs" ステップが生成する。
          if [ -f /tmp/falco_start_logs.txt ]; then
            cp /tmp/falco_start_logs.txt telemetry/falco_start_logs.txt
          fi
          # Stop Falco 直前のログ (シナリオ実行中に出たエラー等を捕捉するため、
          # "Capture Falco logs before stop" ステップが生成する)。
          if [ -f /tmp/falco_stop_logs.txt ]; then
            cp /tmp/falco_stop_logs.txt telemetry/falco_stop_logs.txt
          fi
          # "Stream Falco logs to file" ステップが docker logs -f で継続的に
          # 書き続けた生ログ。--rm でコンテナが消えても内容が残るため、
          # クラッシュ理由の手がかりとして最も確実な一次情報。
          if [ -f /tmp/falco_stream.log ]; then
            cp /tmp/falco_stream.log telemetry/falco_stream.log
          fi
          # 同ステップが docker events から記録した生ログ (die イベント /
          # exitCode の手がかり、取得できた場合)。
          if [ -f /tmp/falco_events_docker.log ]; then
            cp /tmp/falco_events_docker.log telemetry/falco_docker_events.log
          fi
          # scenarios/lib/common.sh が書く実行ログ。仕様必須ではないが、
          # 検知結果の突き合わせに有用なため追加で回収する。
          # パスは docs/REQUIRED-FIXES.md R-3 でワークスペース外
          # (/var/tmp/cicd-runtime-testbed) に移した。$RUNNER_TEMP 配下に
          # 書くと falco の "Source Code Overwrite" ルールが
          # ハーネス自身の書き込みで毎回発火してしまうため。
          testbed_log="${TESTBED_LOG:-/var/tmp/cicd-runtime-testbed/testbed-log.jsonl}"
          if [ -f "${testbed_log}" ]; then
            cp "${testbed_log}" telemetry/testbed-log.jsonl
          fi

      - name: Upload telemetry-falco-live-forked-0.44.1
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-falco-live-forked-0.44.1
          path: telemetry/
          if-no-files-found: warn
          # docs/REQUIRED-FIXES.md R-6: 従来は 1 日で、数日で全証跡が
          # 消えていた。ここに入るのは加工済みテレメトリのみで、
          # カナリアは全て偽値 (canaries/canaries.env, docs/SAFETY.md)
          # なので 7 日に延ばす。生の capture.scap の扱いは
          # falco-analyze.yml 側で別に制御しており、この変更の対象外。
          retention-days: 7
