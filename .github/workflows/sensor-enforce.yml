# .github/workflows/sensor-enforce.yml
#
# 検証目的 (docs/SPEC.md T1 / §5 / §8):
#   cicd-sensor を `monitor_mode: false` で動かし、
#   .cicd-sensor/rules/testbed.yaml の `testbed_kill_marker` ルール
#   (action: terminate) が実際にプロセスを kill するかどうかを確認する。
#   scenarios/90-killme.sh は kill 発火専用で、このワークフローからのみ
#   呼び出す (docs/SPEC.md §4)。
#
# 重要 (仕様の根本的な誤りの修正、docs/SPEC.md §5。旧版のこのワークフローは
# 「実行時に .cicd-sensor/config.yaml を monitor_mode: false へ書き換える」
# ステップを持っていたが、これは完全に無意味 (no-op) だった):
#   cicd-sensor-action は、プロジェクト設定 (.cicd-sensor/config.yaml) と
#   カスタムルール (.cicd-sensor/rules/) を、ジョブのワークスペース上の
#   ファイルからではなく GitHub Contents API 経由でコミット SHA
#   (GITHUB_SHA) から取得する (cicd-sensor-action v0.0.38,
#   src/main.js:643-666)。そのため、このワークフローが checkout 後に
#   .cicd-sensor/config.yaml を書き換えても action はその変更を一切見ず、
#   常にコミット済みの内容 (当時は monitor_mode: true) が使われていた。
#   これが原因で testbed_kill_marker (action: terminate) が
#   action: detect に降格され、kill が起きなかった (run 32544606013,
#   32545681004 で実機確認)。対応として、実行時の書き換えステップを
#   削除し、.cicd-sensor/config.yaml のコミット値そのものを
#   monitor_mode: false にした (詳細は同ファイルのコメント参照)。
#   この結果、monitor_mode はリポジトリ全体で1つの値しか持てず、
#   sensor-monitor.yml と本ワークフローで切り替えることはできない
#   (sensor-monitor.yml への影響は同ワークフローのコメントと
#   README.md「既知の制約」を参照)。
#
#   なお、ジョブ内のプロセスがワークスペース上の設定ファイルを書き換えて
#   自分自身への監視を無効化できない、というこの action の挙動自体は
#   良い設計であり、否定的に書くべき欠陥ではない。
#
# ============================================================================
# 重要 (README にも明記): このワークフローだけは「成功が正常」である。
# 他の 4 本 (falco-live / falco-analyze / sensor-monitor / leak-scan) は
# 検知結果を集めること自体が目的で、赤くなっても異常ではない。
# しかし sensor-enforce.yml は「kill が実際に起きること」を検証するための
# ワークフローなので、assert ジョブが成功 = kill が確認できた = 正常、
# assert ジョブが失敗 = kill されなかった = 異常、という意味になる。
# ============================================================================
#
# ジョブ構成 (docs/SPEC.md §5 のとおり2ジョブ):
#   enforce: 90-killme.sh を実行する。continue-on-error を付け、
#            (期待どおり kill された場合の) 失敗でワークフロー全体を
#            赤くしない。
#   assert:  enforce の結果を判定する。
#
# 実装上の重要な注意 (SPEC からの意図的な逸脱、README にも記載):
#   docs/SPEC.md §5 は判定に `needs.enforce.result` を使うと書いているが、
#   GitHub Actions にはジョブレベルの `continue-on-error: true` を使うと
#   `needs.<job>.result` が実際の失敗結果に関わらず常に "success" を返す
#   という既知の制限がある
#   (https://github.com/actions/toolkit/issues/1739)。
#   これをそのまま実装すると、90-killme.sh が実際に kill されても
#   assert 側では判定不能になり、このワークフローの目的そのものが
#   壊れる。そのため本実装では:
#     - 90-killme.sh を実行するステップ自体に "ステップレベルの"
#       continue-on-error を付け、`steps.killme.outcome` (continue-on-error
#       の影響を受けない、本来の成否) を enforce ジョブの output として
#       公開する。
#     - REACHED_AFTER_KILLME の有無も同じステップの出力を grep して
#       output 化する。
#     - assert ジョブはこの2つの output を判定に使う。
#   これは SPEC §5 が意図する判定ロジック (enforce の失敗 + ログに
#   REACHED_AFTER_KILLME が出ていないこと) と等価であり、GitHub Actions の
#   上記の制限を回避するための実装上の置き換えである。

name: "sensor-enforce: cicd-sensor kill test (monitor_mode: false) — success is expected"

on:
  workflow_dispatch: {}

permissions: {}

# cicd-sensor のバージョンに関する単一の source of truth。
# 詳細な理由は sensor-monitor.yml の同じ env ブロックのコメントを参照
# (`Install cicd-sensorctl` が取得するバイナリと、cicd-sensor-action の
# `cicd-sensor-version` 入力に渡す agent のバージョンを必ず一致させる)。
# リリースタグは `releases/<version>` 形式なので、ここにはバージョン部分
# だけを持ち、`releases/` は download 側で付ける。
env:
  CICD_SENSOR_VERSION: "v0.0.46"

jobs:
  enforce:
    name: "enforce (expected to be killed)"
    runs-on: ubuntu-24.04
    # docs/SPEC.md §5: enforce ジョブに continue-on-error: true を付け、
    # 90-killme.sh が kill されてジョブが失敗しても、ワークフロー全体の
    # 成否には影響させない (最終判定は assert ジョブが行なう)。
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      killme_outcome: ${{ steps.killme.outcome }}
      reached_after_killme: ${{ steps.check_reached.outputs.reached }}
    steps:
      - name: Checkout cicd-runtime-testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 削除済み: 以前ここに「Set monitor_mode false in
      # .cicd-sensor/config.yaml」という、チェックアウト後のワークスペース
      # 上の .cicd-sensor/config.yaml を書き換えるステップがあった。
      # cicd-sensor-action はプロジェクト設定を GitHub Contents API
      # 経由でコミット SHA から取得する (src/main.js:643-666) ため、
      # ワークスペース上のこのファイルへの変更を action は一切見ない。
      # このステップは常に no-op であり、実際に使われていたのはリポジトリ
      # にコミットされている .cicd-sensor/config.yaml の内容 (当時
      # monitor_mode: true) だった。これが run 32544606013 /
      # 32545681004 で kill が起きなかった直接の原因であり、読む人を
      # 誤解させるステップだったため削除した。現在は
      # .cicd-sensor/config.yaml のコミット値そのものを
      # monitor_mode: false にしている (同ファイルのコメント参照)。

      - name: Install cicd-sensorctl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 実機確認済み (docs/REQUIRED-FIXES.md R-1)。詳細な根拠は
          # sensor-monitor.yml の同名ステップのコメントを参照:
          #   - タグは `releases/<version>` 形式
          #   - tar の中身は cicd-sensorctl-linux-amd64 ほか
          #   - `cicd-sensorctl version` というサブコマンドは存在しない
          # 修正前は存在しないタグ `v0.0.38` を指していたため、全 run で
          # ダウンロードに失敗し `Validate .cicd-sensor/rules` は一度も
          # 実行されていなかった。
          mkdir -p "${RUNNER_TEMP}/cicd-sensorctl"
          if gh release download "releases/${CICD_SENSOR_VERSION}" \
              --repo cicd-sensor/cicd-sensor \
              --pattern "cicd-sensor_*_linux_amd64.tar.gz" \
              --dir "${RUNNER_TEMP}/cicd-sensorctl"; then
            tar -xzf "${RUNNER_TEMP}"/cicd-sensorctl/cicd-sensor_*_linux_amd64.tar.gz -C "${RUNNER_TEMP}/cicd-sensorctl"
            sudo install -m 0755 "${RUNNER_TEMP}/cicd-sensorctl/cicd-sensorctl-linux-amd64" /usr/local/bin/cicd-sensorctl
          else
            echo "::warning::failed to download cicd-sensorctl from tag releases/${CICD_SENSOR_VERSION} of cicd-sensor/cicd-sensor. Skipping rule validation (see docs/REQUIRED-FIXES.md R-1)."
          fi

      - name: Validate .cicd-sensor/rules
        # 実地実行 (run 32544606013) で判明した事実への対応: 以前はこの
        # ステップが失敗しても ::warning:: を出すだけで後続
        # (cicd-sensor-action) に進んでいた。しかし testbed_canary_http_host
        # (event_type: http_request, 当時ピン留めしていたバージョン未対応)
        # が1本混入していただけで、cicd-sensor-action 内部の project
        # config fetch がバンドル検証エラーで失敗し、
        # .cicd-sensor/config.yaml の monitor_mode を含むプロジェクト設定
        # 全体が agent に届かずベースラインへフォールバックする、という
        # 重大な不具合を静かに見逃していた (この run では
        # testbed_kill_marker が action: terminate ではなく action: detect
        # として評価され、kill が起きなかった)。そのため、ここで実際に
        # 検証が失敗した場合はこのステップ自体でジョブを失敗させ、以降の
        # ワークフロー実行者が気づけるようにする。cicd-sensorctl そのものが
        # 入手できなかった場合 (ネットワーク障害・rate limit 等) は、
        # 従来どおり警告のみで続行してよいが、「検証をスキップした」ことを
        # job summary に残す。
        run: |
          set -uo pipefail
          if command -v cicd-sensorctl >/dev/null 2>&1; then
            if cicd-sensorctl rule validate .cicd-sensor/rules; then
              {
                echo "## Validate .cicd-sensor/rules: OK"
                echo ""
                echo "\`cicd-sensorctl rule validate .cicd-sensor/rules\` passed."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              {
                echo "## Validate .cicd-sensor/rules: FAILED"
                echo ""
                echo "\`cicd-sensorctl rule validate .cicd-sensor/rules\` exited with status ${status}."
                echo ""
                echo "未対応のイベント型を使っていないか確認すること。**1本でも無効な"
                echo "ルールがあると、プロジェクト設定全体 (\`monitor_mode\` を含む) が"
                echo "agent に届かなくなる** (run 32544606013 で実機確認済み。"
                echo "README.md \"既知の制約\" 参照)。"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::cicd-sensorctl rule validate failed (exit ${status}). Check whether a rule uses an event type unsupported by the pinned cicd-sensor release (e.g. http_request). Even a single invalid rule discards the ENTIRE project config bundle at agent startup — not just that one rule — so monitor_mode and every other custom rule silently fail to reach the agent too. See README.md known limitations (run 32544606013)."
              exit "${status}"
            fi
          else
            {
              echo "## Validate .cicd-sensor/rules: SKIPPED"
              echo ""
              echo "\`cicd-sensorctl\` was not available (see the previous step), so"
              echo "\`cicd-sensorctl rule validate .cicd-sensor/rules\` was **not run** for"
              echo "this job. A rule using an unsupported event type would therefore"
              echo "NOT be caught here — it would only surface later, as a project-config"
              echo "fetch failure inside the \"Start cicd-sensor\" step below, which"
              echo "silently discards \`monitor_mode\` and all custom rules if it happens"
              echo "(see README.md known limitations, run 32544606013)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::cicd-sensorctl not available; rule validation skipped (see job summary — this means an invalid rule would not be caught locally)"
          fi

      - name: Start cicd-sensor (standalone mode)
        uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
        with:
          # 明示的に渡すこと。省略すると action 側の既定値 (v0.0.45) が
          # 使われ、上の `Install cicd-sensorctl` が取得したバージョンと
          # ずれる。v0.0.45 は `event_type: http_request` を受け付けない
          # ため (実験で確認済み)、ずれたままだと
          # testbed_canary_http_host を含むバンドルの検証が agent 側だけで
          # 失敗し、プロジェクト設定全体がベースラインに落ちる
          # (run 32544606013 と同じ事故)。
          cicd-sensor-version: ${{ env.CICD_SENSOR_VERSION }}

      - name: Run kill-trigger scenario (90-killme.sh)
        id: killme
        # ステップレベルの continue-on-error: killed されて非ゼロ終了しても
        # このジョブの後続ステップ (check_reached, テレメトリ収集) を
        # 実行し続けるため。ジョブレベルの continue-on-error だけに頼ると
        # steps.killme.outcome を使えなくなる (このステップが実行されない)
        # ので、両方が必要。
        continue-on-error: true
        run: |
          set -o pipefail
          bash scenarios/90-killme.sh 2>&1 | tee "${RUNNER_TEMP}/killme-output.log"

      - name: Check for REACHED_AFTER_KILLME
        id: check_reached
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/killme-output.log" ] && grep -q "REACHED_AFTER_KILLME" "${RUNNER_TEMP}/killme-output.log"; then
            echo "REACHED_AFTER_KILLME was observed: the process was NOT killed"
            echo "reached=true" >> "$GITHUB_OUTPUT"
          else
            echo "REACHED_AFTER_KILLME was not observed"
            echo "reached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record outcome in job summary
        if: always()
        run: |
          {
            echo "## sensor-enforce: kill-trigger step result"
            echo "- \`killme\` step outcome: \`${{ steps.killme.outcome }}\`"
            echo "- REACHED_AFTER_KILLME observed: \`${{ steps.check_reached.outputs.reached }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  assert:
    name: "assert (this job succeeding is the expected result)"
    needs: enforce
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Verify the kill-trigger process was terminated
        run: |
          set -uo pipefail
          outcome="${{ needs.enforce.outputs.killme_outcome }}"
          reached="${{ needs.enforce.outputs.reached_after_killme }}"

          echo "killme step outcome: ${outcome}"
          echo "REACHED_AFTER_KILLME observed: ${reached}"

          fail=0

          # docs/SPEC.md §5: needs.enforce.result が failure/cancelled で
          # あることが kill された証拠。上記コメントのとおり
          # needs.<job>.result の代わりに steps.killme.outcome を使う。
          if [ "${outcome}" != "failure" ] && [ "${outcome}" != "cancelled" ]; then
            echo "::error::killme step outcome is '${outcome}', expected 'failure' or 'cancelled' — the process does not appear to have been terminated"
            fail=1
          fi

          if [ "${reached}" != "false" ]; then
            echo "::error::REACHED_AFTER_KILLME was observed (or could not be determined) — the process continued running after the point it should have been killed"
            fail=1
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "::error::sensor-enforce assertion FAILED: cicd-sensor did not terminate the kill-trigger process as expected. This is the ONE workflow in this repo where success is the normal outcome and failure indicates a problem."
            exit 1
          fi

          echo "OK: the kill-trigger process was terminated before reaching REACHED_AFTER_KILLME."

      # ----------------------------------------------------------------
      # 実効性確認 (run 32544606013 で判明した不具合への対応):
      # 上の "Verify the kill-trigger process was terminated" ステップは
      # killme ステップの成否と REACHED_AFTER_KILLME の有無しか見ておらず、
      # 「kill されなかった」ときに *なぜ* 起きなかったかを判定できない。
      # 実地実行 (run 32544606013) では、testbed_kill_marker が
      # action: terminate ではなく action: detect として評価されていた
      # (= .cicd-sensor/config.yaml の monitor_mode: false がプロジェクト
      # 設定バンドル検証の失敗により agent に届いていなかった) ことが
      # attestation predicate / HTML レポートの両方から確認できた。
      # 次回以降、同じ失敗が起きた場合に原因をすぐ切り分けられるよう、
      # ここで同じ確認を自動化する。cicd-sensor-action がこれらの
      # アーティファクトを既にアップロード済み (enforce ジョブの
      # post-step) であることを前提に、continue-on-error でダウンロード
      # するだけの読み取り専用ステップで、collect-telemetry ジョブが
      # 行なう retention-days:1 化・削除 (実効的な "所有" 処理) には
      # 一切関与しない。
      # ----------------------------------------------------------------
      - name: Download cicd-sensor-attestation (monitor_mode reality check)
        id: download_attestation_check
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cicd-sensor-attestation
          path: ${{ runner.temp }}/kill-check/cicd-sensor-attestation

      - name: Download cicd-sensor-report.html (monitor_mode reality check)
        id: download_report_check
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cicd-sensor-report.html
          path: ${{ runner.temp }}/kill-check/cicd-sensor-report

      - name: Check actual testbed_kill_marker action (monitor_mode reality check)
        if: always()
        run: |
          set -uo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          import re

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          runner_temp = os.environ["RUNNER_TEMP"]
          action = None
          source = None

          predicate_path = os.path.join(
              runner_temp, "kill-check", "cicd-sensor-attestation", "predicate.json"
          )
          if os.path.isfile(predicate_path):
              try:
                  with open(predicate_path, encoding="utf-8") as f:
                      predicate = json.load(f)
                  monitor_log = predicate.get("monitorLog", {})
                  for key, hits in monitor_log.items():
                      if not key.endswith("/detections/v1alpha1"):
                          continue
                      for hit in hits:
                          if hit.get("rule_id") == "testbed_kill_marker":
                              action = hit.get("action")
                              source = "cicd-sensor-attestation/predicate.json"
                              break
                      if action is not None:
                          break
              except Exception as exc:
                  print(f"::warning::failed to parse predicate.json: {exc}")

          if action is None:
              report_path = os.path.join(
                  runner_temp, "kill-check", "cicd-sensor-report", "cicd-sensor-report.html"
              )
              if os.path.isfile(report_path):
                  try:
                      with open(report_path, encoding="utf-8") as f:
                          html = f.read()
                      m = re.search(
                          r"window\.REPORT_DATA\s*=\s*JSON\.parse\((\".*?\")\)\s*;",
                          html,
                          re.S,
                      )
                      if m:
                          inner_json_text = json.loads(m.group(1))
                          report_data = json.loads(inner_json_text)
                          for hit in report_data.get("hits", []):
                              if hit.get("rule_id") == "testbed_kill_marker":
                                  action = hit.get("action")
                                  source = "cicd-sensor-report.html"
                                  break
                  except Exception as exc:
                      print(f"::warning::failed to parse cicd-sensor-report.html: {exc}")

          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("## testbed_kill_marker: actual action evaluated by the agent\n\n")
              if action is None:
                  f.write(
                      "- Could not determine the actual `action` for `testbed_kill_marker` "
                      "(neither `cicd-sensor-attestation/predicate.json` nor "
                      "`cicd-sensor-report.html` was available/parseable for this run).\n"
                  )
              else:
                  f.write(f"- Source: `{source}`\n")
                  f.write(f"- `testbed_kill_marker` action: `{action}`\n")
                  if action != "terminate":
                      f.write(
                          "- **This is NOT `terminate`.** First check whether "
                          "`.cicd-sensor/config.yaml`'s **committed** `monitor_mode` value "
                          "is `false` at the commit this run checked out — "
                          "cicd-sensor-action fetches project config and rules via the "
                          "GitHub Contents API from `GITHUB_SHA` "
                          "(`src/main.js:643-666`), NOT from the workspace, so any "
                          "runtime rewrite of this file has no effect. If the committed "
                          "value is already `false`, then the project config (including "
                          "`monitor_mode`) may not have reached the agent at all — check "
                          "the `Start cicd-sensor` step log in the `enforce` job for a "
                          "`project config fetch failed` warning (see README.md known "
                          "limitations, run 32544606013 / 32545681004).\n"
                      )

          if action is not None and action != "terminate":
              print(
                  "::error::testbed_kill_marker was evaluated with action='"
                  + action
                  + "', not 'terminate'. .cicd-sensor/config.yaml の monitor_mode が"
                  + " このワークフローが checkout したコミットで false になっているか"
                  + " 確認すること。cicd-sensor-action は設定・ルールを GITHUB_SHA から"
                  + " GitHub Contents API 経由で取得する (src/main.js:643-666) ため、"
                  + " 実行時にこのファイルを書き換えても効かない。コミット値が既に"
                  + " false なら、Start cicd-sensor ステップのログで"
                  + " 'project config fetch failed' の警告が出ていないか確認すること."
              )
          PYEOF

  collect-telemetry:
    name: "collect telemetry (T2)"
    needs: [enforce, assert]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      # See sensor-monitor.yml's identical step for why the artifact `name:`
      # is `cicd-sensor-report.html` (confirmed via `gh api` against a real
      # run) while the local `path:` folder name stays `cicd-sensor-report`
      # (tools/render-matrix.py matches on that basename).
      - name: Download cicd-sensor-report.html
        id: download_report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: cicd-sensor-report.html
          path: telemetry/cicd-sensor-report

      - name: Download cicd-sensor-attestation
        id: download_attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: cicd-sensor-attestation
          path: telemetry/cicd-sensor-attestation

      # 実地実行 (run 32381640678, sensor-monitor.yml) で判明した不具合への
      # 対応。詳細は sensor-monitor.yml の同名ステップのコメントを参照。
      # sensor-enforce.yml でも同じ download-artifact + continue-on-error
      # の組み合わせを使っているため、同じ「収集不完全なのに成功扱い」の
      # リスクがある (docs/SPEC.md §6)。
      - name: Summarize telemetry collection
        id: telemetry_summary
        if: always()
        run: |
          set -uo pipefail
          mkdir -p telemetry

          report_outcome="${{ steps.download_report.outcome }}"
          attestation_outcome="${{ steps.download_attestation.outcome }}"

          total=2
          found=0
          missing_names=""

          {
            echo "# telemetry-manifest.txt"
            echo "# collect-telemetry job of sensor-enforce.yml (run ${{ github.run_id }})"
            echo "# format: <artifact-name>: OK | MISSING (download outcome=<outcome>)"
          } > telemetry/telemetry-manifest.txt

          if [ "${report_outcome}" = "success" ]; then
            found=$((found + 1))
            echo "cicd-sensor-report.html: OK" >> telemetry/telemetry-manifest.txt
          else
            missing_names="${missing_names}cicd-sensor-report.html "
            echo "cicd-sensor-report.html: MISSING (download outcome=${report_outcome})" >> telemetry/telemetry-manifest.txt
          fi

          if [ "${attestation_outcome}" = "success" ]; then
            found=$((found + 1))
            echo "cicd-sensor-attestation: OK" >> telemetry/telemetry-manifest.txt
          else
            missing_names="${missing_names}cicd-sensor-attestation "
            echo "cicd-sensor-attestation: MISSING (download outcome=${attestation_outcome})" >> telemetry/telemetry-manifest.txt
          fi

          {
            echo "## Telemetry collection summary (T2)"
            echo ""
            echo "| artifact | status |"
            echo "| --- | --- |"
            if [ "${report_outcome}" = "success" ]; then
              echo "| \`cicd-sensor-report.html\` | ✅ collected |"
            else
              echo "| \`cicd-sensor-report.html\` | ❌ missing (download outcome=\`${report_outcome}\`) |"
            fi
            if [ "${attestation_outcome}" = "success" ]; then
              echo "| \`cicd-sensor-attestation\` | ✅ collected |"
            else
              echo "| \`cicd-sensor-attestation\` | ❌ missing (download outcome=\`${attestation_outcome}\`) |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${found}" -eq 0 ]; then
            echo "::error::telemetry collection failed: none of the expected artifacts (cicd-sensor-report.html, cicd-sensor-attestation) could be downloaded for this run. See telemetry-manifest.txt / job summary."
            echo "❌ **0 / ${total} expected artifacts collected. Failing this job (docs/SPEC.md §6).**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "${found}" -lt "${total}" ]; then
            echo "::warning::telemetry collection partial: missing ${missing_names}(collected ${found}/${total}). See telemetry-manifest.txt in the uploaded telemetry-cicd-sensor-enforce artifact."
            echo "⚠️ **${found} / ${total} expected artifacts collected. Missing: ${missing_names}(see telemetry-manifest.txt).**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **${found} / ${total} expected artifacts collected.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload telemetry-cicd-sensor-enforce
        # 上の Summarize ステップが「1つも取得できなかった」場合に exit 1
        # するため、if: always() を付けて、その場合でも
        # telemetry-manifest.txt (何が欠けていたかの記録) を含む
        # 部分的なテレメトリを必ずアップロードする。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-cicd-sensor-enforce
          path: telemetry/
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce artifact retention (delete original cicd-sensor-report.html / cicd-sensor-attestation)
        # if: always() so cleanup still runs even if "Summarize telemetry
        # collection" above failed the job (0 artifacts collected case).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for name in cicd-sensor-report.html cicd-sensor-attestation; do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=${name}" \
              --jq '.artifacts[0].id // empty' || true)
            if [ -n "${id}" ]; then
              echo "Deleting artifact '${name}' (id=${id})"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || \
                echo "::warning::failed to delete artifact '${name}' (id=${id}); delete it manually"
            else
              echo "Artifact '${name}' not found; nothing to delete"
            fi
          done
